<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Caterer Reviews | Annapriya</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F5E9DA;
            color: #1C1C1C;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #1C1C1C;
            color: #F5E9DA;

            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            color: #D4A373;
            font-size: 25px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-button {
            text-decoration: none;

            color: #F5E9DA;

            padding: 10px 16px;

            border: 1px solid #D4A373;
            border-radius: 6px;

            font-size: 14px;
        }

        .back-button:hover {
            background: #8B1E3F;
        }

        /* =========================
           PROFILE MENU
        ========================= */

        .profile-container {
            position: relative;
        }

        .profile-button {
            width: 42px;
            height: 42px;

            border-radius: 50%;
            border: none;

            background: #D4A373;
            color: #1C1C1C;

            font-weight: bold;
            font-size: 17px;

            cursor: pointer;
        }

        .profile-menu {
            position: absolute;

            right: 0;
            top: 52px;

            width: 210px;

            background: white;

            border-radius: 8px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.18);

            display: none;

            overflow: hidden;

            z-index: 1000;
        }

        .profile-menu.show {
            display: block;
        }

        .profile-menu a,
        .profile-menu button {

            width: 100%;

            display: block;

            padding: 13px 16px;

            text-decoration: none;

            border: none;

            background: white;

            color: #1C1C1C;

            text-align: left;

            font-size: 14px;

            cursor: pointer;
        }

        .profile-menu a:hover,
        .profile-menu button:hover {
            background: #F5E9DA;
            color: #8B1E3F;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1100px;

            margin: 0 auto;

            padding: 45px 25px;
        }

        .page-title {
            margin-bottom: 30px;
        }

        .page-title h1 {
            color: #8B1E3F;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #555;
        }

        /* =========================
           REVIEW SUMMARY
        ========================= */

        .summary-card {

            background: white;

            border-radius: 10px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .summary-card h2 {
            color: #8B1E3F;
            margin-bottom: 15px;
        }

        .summary-content {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .rating-number {
            font-size: 42px;
            font-weight: bold;
            color: #8B1E3F;
        }

        .stars {
            color: #D4A373;
            font-size: 25px;
            letter-spacing: 3px;
        }

        .review-count {
            color: #666;
            margin-top: 5px;
        }

        /* =========================
           REVIEW LIST
        ========================= */

        .reviews-card {

            background: white;

            border-radius: 10px;

            padding: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .reviews-card h2 {
            color: #8B1E3F;
            margin-bottom: 20px;
        }

        .review {

            border-bottom: 1px solid #eee;

            padding: 20px 0;
        }

        .review:last-child {
            border-bottom: none;
        }

        .review-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 8px;
        }

        .customer-name {
            font-weight: bold;
            color: #1C1C1C;
        }

        .review-date {
            color: #777;
            font-size: 13px;
        }

        .review-stars {
            color: #D4A373;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .review-text {
            color: #555;
            line-height: 1.6;
        }

        .no-reviews {

            text-align: center;

            padding: 40px;

            color: #777;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 0 20px;
            }

            .back-button {
                display: none;
            }

            main {
                padding: 30px 18px;
            }

            .summary-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        🪔 Annapriya
    </div>


    <div class="header-right">

        <a
            href="catererdashboard.html"
            class="back-button"
        >
            ← Dashboard
        </a>


        <div class="profile-container">

            <button
                class="profile-button"
                id="profileButton"
            >
                C
            </button>


            <div
                class="profile-menu"
                id="profileMenu"
            >

                <a href="catererdashboard.html">
                    My Profile
                </a>

                <a href="caterer-profile.html">
                    Edit Profile
                </a>

                <a href="catererreviews.html">
                    My Reviews
                </a>

                <a href="catereraccountsettings.html">
                    Account Settings
                </a>

                <button
                    id="logoutButton"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main>


    <div class="page-title">

        <h1>My Reviews</h1>

        <p>
            See what customers have said about your catering service.
        </p>

    </div>


    <!-- REVIEW SUMMARY -->

    <div class="summary-card">

        <h2>Customer Rating</h2>

        <div class="summary-content">

            <div>

                <div
                    class="rating-number"
                    id="ratingNumber"
                >
                    0.0
                </div>

                <div class="stars">
                    ★★★★★
                </div>

                <div
                    class="review-count"
                    id="reviewCount"
                >
                    0 reviews
                </div>

            </div>

        </div>

    </div>


    <!-- REVIEWS -->

    <div class="reviews-card">

        <h2>Customer Reviews</h2>

        <div id="reviewsContainer">

            <div class="no-reviews">
                No customer reviews yet.
            </div>

        </div>

    </div>


</main>


<script>

    /* =========================
       LOGIN CHECK
    ========================= */

    const token =
        localStorage.getItem(
            "annapriya_caterer_token"
        );

    const catererData =
        localStorage.getItem(
            "annapriya_caterer"
        );


    if (!token || !catererData) {

        window.location.href =
            "index.html";

    }


    let caterer = {};

    try {

        caterer =
            JSON.parse(catererData) || {};

    } catch (error) {

        console.error(
            "Invalid caterer data."
        );

    }


    /* =========================
       PROFILE BUTTON
    ========================= */

    const profileButton =
        document.getElementById(
            "profileButton"
        );

    const profileMenu =
        document.getElementById(
            "profileMenu"
        );


    const catererName =
        caterer.headName ||
        caterer.head_name ||
        "Caterer";


    profileButton.textContent =
        catererName
            .charAt(0)
            .toUpperCase();


    profileButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            profileMenu.classList.toggle(
                "show"
            );

        }
    );


    document.addEventListener(
        "click",
        function() {

            profileMenu.classList.remove(
                "show"
            );

        }
    );


    /* =========================
       LOGOUT
    ========================= */

    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            function() {

                localStorage.removeItem(
                    "annapriya_caterer_token"
                );

                localStorage.removeItem(
                    "annapriya_caterer"
                );

                window.location.href =
                    "index.html";

            }
        );


    /* =========================
       REVIEWS
       
       TEMPORARY DISPLAY
       ========================= */

    /*
        IMPORTANT:

        Your current project does not yet have
        a confirmed caterer-review API endpoint.

        Therefore this page is safely prepared
        for reviews, but it will show the
        "No customer reviews yet" message until
        the review backend is connected.
    */

</script>


</body>

</html>
