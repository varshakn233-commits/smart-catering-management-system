<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Caterer Profile | Annapriya</title>

    <link
        rel="stylesheet"
        href="catererprofile.css"
    >

</head>

<body>


<header class="customer-header">

    <div class="header-left">

        <button
            class="back-button"
            id="backButton"
        >
            ←
        </button>

        <div class="brand-name">
            Annapriya
        </div>

    </div>


    <div class="header-right">

        <button
            class="profile-button"
            id="profileButton"
        >

            <span
                class="avatar"
                id="headerAvatar"
            >
                C
            </span>

            <span id="headerCatererName">
                Caterer
            </span>

            <span class="three-dots">
                ⋮
            </span>

        </button>


        <div
            class="profile-menu"
            id="profileButtonMenu"
        >

            <a href="catererprofile.html">
                👤 My Profile
            </a>

            <a href="catererprofile.html">
                ✏️ Edit Profile
            </a>

            <a href="catererreviews.html">
                ⭐ My Reviews
            </a>

            <a href="catereraccountsettings.html">
                ⚙️ Account Settings
            </a>

            <button id="logoutButton">
                🚪 Logout
            </button>

        </div>

    </div>

</header>


<main class="main-content">


<section class="page-heading">

    <span class="page-label">
        CATERER
    </span>

    <h1>
        👤 My Profile
    </h1>

    <p>
        View and manage your catering business profile.
    </p>

</section>


<section class="profile-card">

    <div class="large-avatar" id="largeAvatar">
        C
    </div>


    <h2 id="profileName">
        Caterer
    </h2>

    <p id="profileBrand">
        -
    </p>


    <div class="profile-grid">


        <div class="profile-item">
            <span>Head / Owner Name</span>
            <strong id="headName">-</strong>
        </div>


        <div class="profile-item">
            <span>Brand Name</span>
            <strong id="brandName">-</strong>
        </div>


        <div class="profile-item">
            <span>Email</span>
            <strong id="email">-</strong>
        </div>


        <div class="profile-item">
            <span>Phone</span>
            <strong id="phone">-</strong>
        </div>


        <div class="profile-item">
            <span>Helpers</span>
            <strong id="helpers">-</strong>
        </div>


        <div class="profile-item">
            <span>Events Served</span>
            <strong id="eventsServed">-</strong>
        </div>


    </div>


    <button
        class="primary-button"
        id="editProfileButton"
    >
        ✏️ Edit Profile
    </button>

</section>


</main>


<script src="catererprofile.js"></script>

</body>

</html>
