<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Track Your Event | Annapriya</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{
    font-family:Arial,sans-serif;
    background:#F5E9DA;
    color:#1C1C1C;
    min-height:100vh;
}


.top-navbar{
    background:#8B1E3F;
    color:white;
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}


.logo{
    font-size:23px;
    font-weight:bold;
}


.back-button{
    color:white;
    text-decoration:none;
    font-size:14px;
}


.container{
    max-width:760px;
    margin:30px auto;
    padding:0 14px 40px;
}


.card{
    background:white;
    border-radius:22px;
    padding:28px 30px;
    box-shadow:0 6px 22px rgba(0,0,0,.08);
}


.head{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:30px;
}


.head h1{
    font-size:25px;
    margin-bottom:7px;
}


.sub{
    color:#777;
    font-size:14px;
}


.badge{
    background:#F9E6EE;
    color:#8B1E3F;
    padding:9px 14px;
    border-radius:22px;
    font-size:13px;
    font-weight:bold;
    height:max-content;
    white-space:nowrap;
}


.progress{
    position:relative;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    min-width:500px;
}


.progress-wrap{
    overflow-x:auto;
    padding:4px 0 8px;
}


.line,
.filled{
    position:absolute;
    top:18px;
    left:12.5%;
    height:4px;
    border-radius:10px;
    width:75%;
}


.line{
    background:#E8DDCC;
}


.filled{
    background:#8B1E3F;
    width:0;
    transition:.3s;
}


.stage{
    text-align:center;
    position:relative;
    z-index:2;
}


.circle{
    width:38px;
    height:38px;
    margin:auto auto 9px;
    border-radius:50%;
    background:#F4EEE5;
    border:3px solid #E8DDCC;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}


.stage.done .circle{
    background:#8B1E3F;
    border-color:#8B1E3F;
    color:white;
}


.stage.current .circle{
    background:white;
    border-color:#8B1E3F;
    box-shadow:0 0 0 7px #F9E6EE;
}


.title{
    font-size:13px;
    font-weight:bold;
    color:#777;
    margin-bottom:4px;
}


.stage.done .title,
.stage.current .title{
    color:#1C1C1C;
}


.time{
    font-size:11px;
    color:#999;
}


.message{
    background:#F9E6EE;
    color:#8B1E3F;
    border-radius:12px;
    padding:14px 16px;
    font-size:14px;
    font-weight:bold;
    margin-top:25px;
}


.divider{
    height:1px;
    background:#E9E0D4;
    margin:28px 0;
}


.booking{
    display:flex;
    align-items:center;
    gap:16px;
}


.icon{
    width:70px;
    height:70px;
    border-radius:15px;
    background:linear-gradient(135deg,#D4A373,#8B1E3F);
    flex-shrink:0;
}


.booking h2{
    font-size:17px;
    margin-bottom:7px;
}


.booking p{
    color:#777;
    font-size:13px;
    line-height:1.5;
}


.extra-info{
    margin-top:22px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}


.info-box{
    background:#FAF6F0;
    border-radius:12px;
    padding:13px;
}


.info-label{
    display:block;
    color:#888;
    font-size:11px;
    margin-bottom:5px;
}


.info-value{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#333;
}


.payment-info{
    margin-top:18px;
    padding:14px 16px;
    background:#F4F8EE;
    color:#3D6B2F;
    border-radius:12px;
    font-size:13px;
    font-weight:bold;
}


.enquiry-info{
    margin-top:18px;
    padding:14px 16px;
    background:#FFF7E8;
    color:#8B5A00;
    border-radius:12px;
    font-size:13px;
}


.loading,
.error{
    background:white;
    border-radius:16px;
    padding:40px;
    text-align:center;
}


.error{
    color:#B00020;
}


@media(max-width:600px){

    .container{
        margin:20px auto;
    }


    .card{
        padding:23px 18px;
    }


    .head h1{
        font-size:22px;
    }


    .badge{
        font-size:12px;
        padding:8px 10px;
    }


    .booking h2{
        font-size:15px;
    }


    .icon{
        width:62px;
        height:62px;
    }


    .extra-info{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<header class="top-navbar">

    <div class="logo">
        Annapriya
    </div>


    <a
        href="myrequests.html"
        class="back-button"
    >
        ← My Requests
    </a>

</header>


<main class="container">

    <div id="content">

        <div class="loading">
            Loading event tracking...
        </div>

    </div>

</main>


<script>


// ======================================================
// REQUEST ID
// ======================================================

const requestId =
    new URLSearchParams(
        location.search
    ).get("requestId");


// ======================================================
// EVENT TRACKING STAGES
// ======================================================

const stages = [

    {
        title:"Confirmed",
        icon:"✓"
    },

    {
        title:"Preparing",
        icon:"👨‍🍳"
    },

    {
        title:"On the Way",
        icon:"🚚"
    },

    {
        title:"Completed",
        icon:"🍽️"
    }

];


// ======================================================
// GET VISUAL STAGE
// ======================================================

function visualIndex(status){

    if(
        [
            "request_submitted",
            "caterer_accepted",
            "payment_completed"
        ].includes(status)
    ){

        return 0;

    }


    if(
        status === "preparing"
    ){

        return 1;

    }


    if(
        [
            "on_the_way",
            "event_started"
        ].includes(status)
    ){

        return 2;

    }


    if(
        status === "event_completed"
    ){

        return 3;

    }


    return 0;

}


// ======================================================
// FORMAT DATE
// ======================================================

function formatDate(value){

    if(!value){

        return "Date not available";

    }


    const d =
        new Date(value);


    if(
        isNaN(d.getTime())
    ){

        return "Date not available";

    }


    return d.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


// ======================================================
// FORMAT TIME
// ======================================================

function formatTime(value){

    if(!value){

        return "Time not available";

    }


    const parts =
        String(value).split(":");


    if(parts.length < 2){

        return value;

    }


    let hour =
        parseInt(parts[0],10);


    const minute =
        parts[1];


    const period =
        hour >= 12
            ? "PM"
            : "AM";


    hour =
        hour % 12 || 12;


    return `${String(hour).padStart(2,"0")}:${minute} ${period}`;

}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ======================================================
// TRACKING MESSAGE
// ======================================================

function getTrackingMessage(
    requestStatus,
    trackingStatus,
    payment
){

    if(
        requestStatus ===
        "payment_pending"
    ){

        return "💳 Your caterer has accepted the booking. Payment is pending.";

    }


    if(
        requestStatus ===
        "confirmed" &&
        payment?.payment_status === "paid"
    ){

        return "🎉 Payment completed successfully. Your booking is confirmed!";

    }


    if(
        trackingStatus ===
        "preparing"
    ){

        return "👨‍🍳 Your caterer's team is preparing everything for your event.";

    }


    if(
        [
            "on_the_way",
            "event_started"
        ].includes(
            trackingStatus
        )
    ){

        return "🚚 Your caterer's team is on the way to your venue!";

    }


    if(
        trackingStatus ===
        "event_completed"
    ){

        return "🎉 Your catering event has been completed successfully!";

    }


    if(
        trackingStatus ===
        "payment_completed"
    ){

        return "💳 Payment completed. Your booking is confirmed!";

    }


    if(
        trackingStatus ===
        "caterer_accepted"
    ){

        return "✅ Your caterer has accepted your event request. Payment is now pending.";

    }


    if(
        requestStatus ===
        "rejected"
    ){

        return "❌ Your event request was rejected by the caterer.";

    }


    return "📋 Your event request has been submitted.";

}


// ======================================================
// LOAD TRACKING
// ======================================================

async function loadTracking(){

    const content =
        document.getElementById(
            "content"
        );


    if(!requestId){

        content.innerHTML = `

            <div class="error">

                Request ID is missing.

            </div>

        `;

        return;

    }


    try{

        const response =
            await fetch(
                "http://localhost:5000/api/tracking/" +
                encodeURIComponent(requestId)
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Could not load tracking."
            );

        }


        const request =
            data.request;


        const tracking =
            data.tracking;


        const enquiry =
            data.enquiry;


        const payment =
            data.payment;


        const trackingStatus =
            tracking?.tracking_status ||
            "request_submitted";


        const requestStatus =
            String(
                request?.status || ""
            ).toLowerCase();


        const current =
            visualIndex(
                trackingStatus
            );


        // ==================================================
        // PROGRESS WIDTH
        // ==================================================

        let width = 0;


        if(current === 1){

            width = 25;

        }


        if(current === 2){

            width = 50;

        }


        if(current === 3){

            width = 75;

        }


        // ==================================================
        // STAGES HTML
        // ==================================================

        let stagesHTML = "";


        stages.forEach(
            (stage,index)=>{

                const cls =
                    index < current
                        ? "done"
                        : index === current
                            ? "current"
                            : "";


                stagesHTML += `

                    <div
                        class="stage ${cls}"
                    >

                        <div class="circle">

                            ${
                                index < current
                                    ? "✓"
                                    : stage.icon
                            }

                        </div>


                        <div class="title">

                            ${escapeHTML(
                                stage.title
                            )}

                        </div>


                        <div class="time">

                            ${
                                index < current
                                    ? "Completed"
                                    : index === current
                                        ? "Now"
                                        : "—"
                            }

                        </div>

                    </div>

                `;

            }
        );


        // ==================================================
        // PAYMENT INFORMATION
        // ==================================================

        let paymentHTML = "";


        if(payment){

            if(
                payment.payment_status ===
                "paid"
            ){

                paymentHTML = `

                    <div class="payment-info">

                        💳 Payment Completed

                        ${
                            payment.payment_method
                                ? ` · ${escapeHTML(
                                    payment.payment_method
                                )}`
                                : ""
                        }

                    </div>

                `;

            }

            else if(
                payment.payment_status ===
                "pending"
            ){

                paymentHTML = `

                    <div class="payment-info">

                        💳 Payment Pending

                    </div>

                `;

            }

        }


        // ==================================================
        // ENQUIRY INFORMATION
        // ==================================================

        let enquiryHTML = "";


        if(enquiry){

            enquiryHTML = `

                <div class="enquiry-info">

                    💬 Linked to Enquiry #${escapeHTML(
                        enquiry.enquiry_id
                    )}

                    ${
                        enquiry.caterer_reply
                            ? `
                                <br><br>
                                <strong>
                                    Caterer's Reply:
                                </strong>

                                ${escapeHTML(
                                    enquiry.caterer_reply
                                )}
                            `
                            : ""
                    }

                </div>

            `;

        }


        // ==================================================
        // MAIN CONTENT
        // ==================================================

        content.innerHTML = `

            <section class="card">


                <div class="head">

                    <div>

                        <h1>
                            Track Your Event
                        </h1>


                        <p class="sub">

                            ${escapeHTML(
                                request.event_type ||
                                "Catering Event"
                            )}

                            ·

                            ${escapeHTML(
                                enquiry?.caterer_name ||
                                "Annapriya Catering"
                            )}

                        </p>

                    </div>


                    <div class="badge">

                        ${escapeHTML(
                            requestStatus ===
                            "payment_pending"
                                ? "Payment Pending"
                                : requestStatus ===
                                  "confirmed"
                                    ? "Confirmed"
                                    : stages[current].title
                        )}

                    </div>

                </div>


                <div class="progress-wrap">

                    <div class="progress">

                        <div class="line"></div>

                        <div
                            class="filled"
                            style="width:${width}%"
                        ></div>


                        ${stagesHTML}

                    </div>

                </div>


                <div class="message">

                    ${getTrackingMessage(
                        requestStatus,
                        trackingStatus,
                        payment
                    )}

                </div>


                ${enquiryHTML}


                ${paymentHTML}


                <div class="divider"></div>


                <div class="booking">

                    <div class="icon"></div>


                    <div>

                        <h2>

                            Booking #${escapeHTML(
                                request.request_id
                            )}

                            ·

                            ${escapeHTML(
                                request.guest_count ||
                                "—"
                            )}

                            guests

                        </h2>


                        <p>

                            ${escapeHTML(
                                formatDate(
                                    request.event_date
                                )
                            )}

                            ·

                            ${escapeHTML(
                                formatTime(
                                    request.event_time
                                )
                            )}

                            ·

                            ${escapeHTML(
                                request.venue_location ||
                                "Venue not available"
                            )}

                        </p>

                    </div>

                </div>


                <div class="extra-info">


                    <div class="info-box">

                        <span class="info-label">
                            🍽️ Food Type
                        </span>

                        <span class="info-value">

                            ${escapeHTML(
                                request.food_type ||
                                "Not specified"
                            )}

                        </span>

                    </div>


                    <div class="info-box">

                        <span class="info-label">
                            📦 Package
                        </span>

                        <span class="info-value">

                            ${escapeHTML(
                                request.package_name ||
                                "Not specified"
                            )}

                        </span>

                    </div>


                    <div class="info-box">

                        <span class="info-label">
                            💰 Budget
                        </span>

                        <span class="info-value">

                            ${
                                request.budget
                                    ? "₹" +
                                      Number(
                                          request.budget
                                      ).toLocaleString(
                                          "en-IN"
                                      )
                                    : "Not specified"
                            }

                        </span>

                    </div>


                    <div class="info-box">

                        <span class="info-label">
                            📋 Request Status
                        </span>

                        <span class="info-value">

                            ${escapeHTML(
                                requestStatus ===
                                "payment_pending"
                                    ? "Payment Pending"
                                    : requestStatus ===
                                      "confirmed"
                                        ? "Booking Confirmed"
                                        : requestStatus ===
                                          "rejected"
                                            ? "Rejected"
                                            : "Active"
                            )}

                        </span>

                    </div>


                </div>


            </section>

        `;


    }
    catch(error){

        console.error(
            "Tracking error:",
            error
        );


        content.innerHTML = `

            <div class="error">

                ❌ ${escapeHTML(
                    error.message ||
                    "Could not load tracking."
                )}

            </div>

        `;

    }

}


// ======================================================
// START
// ======================================================

loadTracking();

</script>

</body>
</html>
