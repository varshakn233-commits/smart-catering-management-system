
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Events | Annapriya</title>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Work Sans", sans-serif;
            background: #F5E9DA;
            color: #1C1C1C;
            min-height: 100vh;
        }

        .customer-header {
            width: 100%;
            min-height: 78px;
            background: #FFFDF9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 5%;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
            position: relative;
            z-index: 100;
        }

        .header-left,
        .header-right,
        .caterer-header-info {
            display: flex;
            align-items: center;
        }

        .header-left {
            gap: 18px;
        }

        .header-right {
            gap: 14px;
            position: relative;
        }

        .back-button,
        .notification-button,
        .dots-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #F5E9DA;
            color: #1C1C1C;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button { font-size: 22px; }
        .notification-button { font-size: 19px; }
        .dots-button { font-size: 25px; }

        .back-button:hover,
        .notification-button:hover,
        .dots-button:hover {
            background: #D4A373;
        }

        .brand-name {
            font-family: "Fraunces", serif;
            font-size: 28px;
            font-weight: 700;
            color: #8B1E3F;
        }

        .caterer-header-info {
            gap: 9px;
            padding: 6px 4px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #8B1E3F;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .caterer-name {
            font-weight: 600;
            font-size: 14px;
        }

        .profile-menu {
            position: absolute;
            top: 54px;
            right: 0;
            width: 215px;
            background: #FFFDF9;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .12);
            padding: 8px;
            display: none;
            z-index: 200;
        }

        .profile-menu.show {
            display: block;
        }

        .profile-menu a,
        .profile-menu button {
            display: block;
            width: 100%;
            text-align: left;
            text-decoration: none;
            border: none;
            background: transparent;
            color: #1C1C1C;
            padding: 12px 13px;
            border-radius: 8px;
            font: 14px "Work Sans", sans-serif;
            cursor: pointer;
        }

        .profile-menu a:hover,
        .profile-menu button:hover {
            background: #F5E9DA;
            color: #8B1E3F;
        }

        .main-content {
            padding: 40px 5%;
            width: 100%;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-label {
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 600;
            color: #A66B35;
            margin-bottom: 8px;
            display: block;
        }

        .page-header h1 {
            font-family: "Fraunces", serif;
            font-size: 38px;
            color: #8B1E3F;
        }

        .page-header p {
            margin-top: 8px;
            color: #666;
            font-size: 15px;
        }

        .dashboard-btn,
        .retry-btn {
            text-decoration: none;
            background: #1C1C1C;
            color: #F5E9DA;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font: 500 14px "Work Sans", sans-serif;
            cursor: pointer;
            display: inline-block;
        }

        .dashboard-btn:hover,
        .retry-btn:hover {
            background: #8B1E3F;
        }

        .table-container {
            background: #FFFDF9;
            border-radius: 14px;
            overflow-x: auto;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .08);
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #1C1C1C;
            color: #FFFDF9;
            padding: 15px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
        }

        td {
            padding: 16px 15px;
            border-bottom: 1px solid #eadbc9;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover td {
            background: #FBF3E9;
        }

        .event-name {
            font-weight: 600;
            color: #8B1E3F;
        }

        .status {
            display: inline-block;
            background: #E7F3E8;
            color: #39733F;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status.pending {
            background: #FFF0D2;
            color: #875A12;
        }

        .status.cancelled {
            background: #FBE5E5;
            color: #A12626;
        }

        .message-cell {
            text-align: center;
            padding: 40px 20px !important;
            color: #666;
            line-height: 1.8;
        }

        .error-text {
            color: #A12626;
        }

        .notification-message {
            display: none;
            position: absolute;
            top: 52px;
            right: 50px;
            width: 230px;
            background: #FFFDF9;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .12);
            font-size: 13px;
            z-index: 201;
        }

        .notification-message.show {
            display: block;
        }

        @media (max-width: 800px) {
            .customer-header {
                padding: 12px 20px;
            }

            .main-content {
                padding: 25px 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 32px;
            }

            .caterer-name {
                display: none;
            }

            .brand-name {
                font-size: 23px;
            }

            .header-left {
                gap: 10px;
            }

            .header-right {
                gap: 7px;
            }
        }

        @media (max-width: 420px) {
            .notification-button {
                display: none;
            }

            .back-button,
            .dots-button {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>

<body>

<header class="customer-header">
    <div class="header-left">
        <button class="back-button" id="backButton"
                type="button" title="Go Back" aria-label="Go back">←</button>
        <div class="brand-name">Annapriya</div>
    </div>

    <div class="header-right">
        <button class="notification-button" id="notificationButton"
                type="button" title="Notifications" aria-label="Notifications">
            🔔
        </button>

        <div class="notification-message" id="notificationMessage">
            Your event notifications will appear here.
        </div>

        <div class="caterer-header-info">
            <span class="avatar" id="headerAvatar">C</span>
            <span class="caterer-name" id="headerCatererName">Caterer</span>
        </div>

        <button class="dots-button" id="profileButton"
                type="button" title="Profile menu"
                aria-label="Profile menu" aria-expanded="false">⋮</button>

        <div class="profile-menu" id="profileButtonMenu">
            <a href="catererprofile.html">👤 My Profile</a>
            <a href="catererprofile.html">✏️ Edit Profile</a>
            <a href="catererreviews.html">⭐ My Reviews</a>
            <a href="catereraccountsettings.html">⚙️ Account Settings</a>
            <button type="button" id="logoutButton">🚪 Logout</button>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="page-header">
        <div>
            <span class="page-label">CATERER</span>
            <h1>My Events</h1>
            <p>View your confirmed upcoming events.</p>
        </div>

        <a href="catererdashboard.html" class="dashboard-btn">
            Dashboard
        </a>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Guests</th>
                    <th>Location</th>
                    <th>Package</th>
                    <th>Phone</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="eventsBody">
                <tr>
                    <td colspan="8" class="message-cell">
                        Loading your events...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
"use strict";

document.addEventListener("DOMContentLoaded", function () {

    const API_BASE = "http://localhost:5000";

    const eventsBody = document.getElementById("eventsBody");
    const profileButton = document.getElementById("profileButton");
    const profileMenu = document.getElementById("profileButtonMenu");
    const notificationButton = document.getElementById("notificationButton");
    const notificationMessage = document.getElementById("notificationMessage");

    let caterer = null;

    try {
        caterer = JSON.parse(
            localStorage.getItem("annapriya_caterer") || "null"
        );
    } catch (error) {
        console.error("Could not read caterer login information:", error);
    }

    if (!caterer) {
        window.location.replace("index.html");
        return;
    }

    const catererName =
        caterer.headName ||
        caterer.head_name ||
        caterer.caterer_name ||
        caterer.name ||
        "Caterer";

    document.getElementById("headerCatererName").textContent = catererName;

    document.getElementById("headerAvatar").textContent =
        catererName.trim().charAt(0).toUpperCase() || "C";

    document.getElementById("backButton").addEventListener("click", function () {
        window.location.href = "catererdashboard.html";
    });

    profileButton.addEventListener("click", function (event) {
        event.stopPropagation();

        const isOpen = profileMenu.classList.toggle("show");

        profileButton.setAttribute("aria-expanded", String(isOpen));
        notificationMessage.classList.remove("show");
    });

    document.addEventListener("click", function (event) {
        if (!profileMenu.contains(event.target) &&
            !profileButton.contains(event.target)) {
            profileMenu.classList.remove("show");
            profileButton.setAttribute("aria-expanded", "false");
        }

        if (!notificationMessage.contains(event.target) &&
            !notificationButton.contains(event.target)) {
            notificationMessage.classList.remove("show");
        }
    });

    notificationButton.addEventListener("click", function (event) {
        event.stopPropagation();

        notificationMessage.classList.toggle("show");
        profileMenu.classList.remove("show");
        profileButton.setAttribute("aria-expanded", "false");
    });

    document.getElementById("logoutButton").addEventListener("click", function () {
        if (confirm("Are you sure you want to log out?")) {
            localStorage.removeItem("annapriya_caterer");
            window.location.href = "index.html";
        }
    });

    // Safely encode text before inserting it into HTML.
    function escapeHTML(value) {
        if (value === null || value === undefined) {
            return "";
        }

        const replacements = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        };

        return String(value).replace(/[&<>"']/g, function (character) {
            return replacements[character];
        });
    }

    // Format SQL dates without shifting the calendar day.
    function formatDate(value) {
        if (!value) {
            return "Not available";
        }

        const raw = String(value);
        const sqlDateMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);

        if (sqlDateMatch) {
            const year = Number(sqlDateMatch[1]);
            const month = Number(sqlDateMatch[2]) - 1;
            const day = Number(sqlDateMatch[3]);

            const date = new Date(year, month, day);

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }

        const date = new Date(raw);

        if (Number.isNaN(date.getTime())) {
            return raw;
        }

        return date.toLocaleDateString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });
    }

    function formatStatus(status) {
        const value = String(status || "confirmed")
            .trim()
            .toLowerCase();

        const labels = {
            payment_pending: "Payment Pending",
            pending: "Pending",
            confirmed: "Confirmed",
            preparing: "Preparing",
            on_the_way: "On the Way",
            event_started: "Event Started",
            completed: "Completed",
            cancelled: "Cancelled",
            rejected: "Rejected"
        };

        return labels[value] ||
            value.replace(/_/g, " ").replace(/\b\w/g, function (letter) {
                return letter.toUpperCase();
            });
    }

    function statusClass(status) {
        const value = String(status || "").toLowerCase();

        if (value === "cancelled" || value === "rejected") {
            return "cancelled";
        }

        if (value === "pending" || value === "payment_pending") {
            return "pending";
        }

        return "";
    }

    function showMessage(message, isError) {
        eventsBody.innerHTML = `
            <tr>
                <td colspan="8" class="message-cell ${isError ? "error-text" : ""}">
                    ${escapeHTML(message)}
                </td>
            </tr>
        `;
    }

    function renderEvents(events) {
        if (!Array.isArray(events) || events.length === 0) {
            showMessage("No events found for your caterer yet.", false);
            return;
        }

        eventsBody.innerHTML = events.map(function (event) {
            const eventType =
                event.event_type ||
                event.event_name ||
                event.eventType ||
                "Event";

            const customerName =
                event.customer_name ||
                event.full_name ||
                event.customerName ||
                "Not available";

            const eventDate =
                event.event_date ||
                event.date ||
                event.eventDate;

            const guestCount =
                event.guest_count ??
                event.guests ??
                event.guestCount;

            const location =
                event.venue_location ||
                event.location ||
                event.venue ||
                "Not available";

            const packageName =
                event.package_name ||
                event.packageName ||
                "Not specified";

            const phone =
                event.phone ||
                event.customer_phone ||
                event.customerPhone ||
                "Not available";

            const status = event.status || "confirmed";

            return `
                <tr>
                    <td class="event-name">${escapeHTML(eventType)}</td>
                    <td>${escapeHTML(customerName)}</td>
                    <td>${escapeHTML(formatDate(eventDate))}</td>
                    <td>${escapeHTML(guestCount ?? "Not available")}</td>
                    <td>${escapeHTML(location)}</td>
                    <td>${escapeHTML(packageName)}</td>
                    <td>${escapeHTML(phone)}</td>
                    <td>
                        <span class="status ${statusClass(status)}">
                            ${escapeHTML(formatStatus(status))}
                        </span>
                    </td>
                </tr>
            `;
        }).join("");
    }

    // Load events belonging to the logged-in caterer.
    async function loadEvents() {

        const possibleEmails = [
            caterer.email,
            caterer.caterer_email,
            caterer.catererEmail,
            caterer.email_address,
            caterer.emailAddress
        ];

        const catererEmail = possibleEmails.find(
            value => typeof value === "string" && value.trim()
        );

        if (!catererEmail) {
            showMessage(
                "Caterer email is missing from your saved login. Please log out and log in again.",
                true
            );

            console.error(
                "Saved caterer information fields:",
                Object.keys(caterer)
            );

            return;
        }

        showMessage("Loading your events...", false);

        const endpoint =
            API_BASE +
            "/api/requests/caterer/" +
            encodeURIComponent(catererEmail.trim()) +
            "/events";

        try {
            const response = await fetch(endpoint, {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            });

            const responseText = await response.text();
            let data;

            try {
                data = responseText ? JSON.parse(responseText) : {};
            } catch (error) {
                throw new Error(
                    "The backend returned an invalid response. Check the API route."
                );
            }

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    data.error ||
                    "Server error (" + response.status + ")."
                );
            }

            let events;

            if (Array.isArray(data)) {
                events = data;
            } else if (Array.isArray(data.events)) {
                events = data.events;
            } else if (Array.isArray(data.data)) {
                events = data.data;
            } else {
                throw new Error(
                    "The API response does not contain an events list."
                );
            }

            renderEvents(events);

        } catch (error) {
            console.error("My Events loading error:", error);
            console.error("Requested API:", endpoint);

            showMessage(
                error.message ||
                "Unable to load events. Check that the backend is running.",
                true
            );

            const row = eventsBody.querySelector("td");

            if (row) {
                const retryButton = document.createElement("button");

                retryButton.type = "button";
                retryButton.className = "retry-btn";
                retryButton.textContent = "Try Again";
                retryButton.style.marginTop = "12px";

                retryButton.addEventListener("click", loadEvents);

                row.appendChild(document.createElement("br"));
                row.appendChild(retryButton);
            }
        }
    }

    loadEvents();
});
</script>

</body>
</html>
