<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Events | Annapriya</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           BASIC RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "Work Sans", sans-serif;

            background: #F5E9DA;

            color: #1C1C1C;

            min-height: 100vh;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .customer-header {

            width: 100%;

            height: 78px;

            background: #FFFDF9;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 5%;

            box-shadow: 0 2px 12px rgba(0,0,0,0.06);

            position: relative;

            z-index: 100;

        }


        .header-left {

            display: flex;

            align-items: center;

            gap: 18px;

        }


        .back-button {

            width: 40px;

            height: 40px;

            border: none;

            border-radius: 50%;

            background: #F5E9DA;

            color: #1C1C1C;

            font-size: 22px;

            cursor: pointer;

        }


        .back-button:hover {

            background: #D4A373;

        }


        .brand-name {

            font-family: "Fraunces", serif;

            font-size: 28px;

            font-weight: 700;

            color: #8B1E3F;

        }


        /* =====================================================
           HEADER RIGHT
        ===================================================== */

        .header-right {

            display: flex;

            align-items: center;

            gap: 14px;

            position: relative;

        }


        /* =====================================================
           NOTIFICATION
        ===================================================== */

        .notification-button {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 50%;

            background: #F5E9DA;

            cursor: pointer;

            font-size: 19px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .notification-button:hover {

            background: #D4A373;

        }


        /* =====================================================
           CATERER INFO
        ===================================================== */

        .caterer-header-info {

            display: flex;

            align-items: center;

            gap: 9px;

            padding: 6px 4px;

        }


        .avatar {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            background: #8B1E3F;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: 600;

            font-size: 15px;

        }


        .caterer-name {

            font-weight: 600;

            color: #1C1C1C;

            font-size: 14px;

        }


        /* =====================================================
           THREE DOT BUTTON
        ===================================================== */

        .dots-button {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 50%;

            background: #F5E9DA;

            color: #1C1C1C;

            font-size: 25px;

            cursor: pointer;

            line-height: 1;

        }


        .dots-button:hover {

            background: #D4A373;

        }


        /* =====================================================
           DROPDOWN MENU
        ===================================================== */

        .profile-menu {

            position: absolute;

            top: 54px;

            right: 0;

            width: 215px;

            background: #FFFDF9;

            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.12);

            padding: 8px;

            display: none;

            z-index: 200;

        }


        .profile-menu.show {

            display: block;

        }


        .profile-menu a,

        .profile-menu button {

            display: block;

            width: 100%;

            text-align: left;

            text-decoration: none;

            border: none;

            background: transparent;

            color: #1C1C1C;

            padding: 12px 13px;

            border-radius: 8px;

            font-family: "Work Sans", sans-serif;

            font-size: 14px;

            cursor: pointer;

        }


        .profile-menu a:hover,

        .profile-menu button:hover {

            background: #F5E9DA;

            color: #8B1E3F;

        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .main-content {

            padding: 40px 5%;

            width: 100%;

        }


        /* =====================================================
           PAGE HEADER
        ===================================================== */

        .page-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }


        .page-label {

            font-size: 12px;

            letter-spacing: 2px;

            font-weight: 600;

            color: #D4A373;

            margin-bottom: 8px;

            display: block;

        }


        .page-header h1 {

            font-family: "Fraunces", serif;

            font-size: 38px;

            color: #8B1E3F;

        }


        .page-header p {

            margin-top: 8px;

            color: #666;

            font-size: 15px;

        }


        /* =====================================================
           DASHBOARD BUTTON
        ===================================================== */

        .dashboard-btn {

            text-decoration: none;

            background: #1C1C1C;

            color: #F5E9DA;

            padding: 12px 20px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 500;

        }


        .dashboard-btn:hover {

            background: #8B1E3F;

        }


        /* =====================================================
           TABLE CARD
        ===================================================== */

        .table-container {

            background: #FFFDF9;

            border-radius: 14px;

            overflow-x: auto;

            box-shadow: 0 5px 18px rgba(0,0,0,0.08);

            margin-top: 30px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 850px;

        }


        th {

            background: #1C1C1C;

            color: #FFFDF9;

            padding: 15px;

            text-align: left;

            font-size: 14px;

        }


        td {

            padding: 16px 15px;

            border-bottom: 1px solid #eadbc9;

            font-size: 14px;

        }


        tr:last-child td {

            border-bottom: none;

        }


        tr:hover td {

            background: #FBF3E9;

        }


        .event-name {

            font-weight: 600;

            color: #8B1E3F;

        }


        .status {

            display: inline-block;

            background: #E7F3E8;

            color: #39733F;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .customer-header {

                padding: 0 20px;

            }


            .main-content {

                padding: 25px 20px;

            }


            .page-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 18px;

            }


            .page-header h1 {

                font-size: 32px;

            }


            .dashboard-btn {

                align-self: flex-start;

            }


            .caterer-name {

                display: none;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="customer-header">


        <div class="header-left">


            <button
                class="back-button"
                id="backButton"
                type="button"
                title="Go Back"
            >
                ←
            </button>


            <div class="brand-name">
                Annapriya
            </div>


        </div>


        <div class="header-right">


            <!-- NOTIFICATION -->

            <button
                class="notification-button"
                id="notificationButton"
                type="button"
                title="Notifications"
            >
                🔔
            </button>


            <!-- CATERER NAME -->

            <div class="caterer-header-info">


                <span
                    class="avatar"
                    id="headerAvatar"
                >
                    C
                </span>


                <span
                    class="caterer-name"
                    id="headerCatererName"
                >
                    Caterer
                </span>


            </div>


            <!-- THREE DOTS -->

            <button
                class="dots-button"
                id="profileButton"
                type="button"
                title="Menu"
            >
                ⋮
            </button>


            <!-- DROPDOWN -->

            <div
                class="profile-menu"
                id="profileButtonMenu"
            >


                <a href="catererprofile.html">
                    👤 My Profile
                </a>


                <a href="catererprofile.html">
                    ✏️ Edit Profile
                </a>


                <a href="catererreviews.html">
                    ⭐ My Reviews
                </a>


                <a href="catereraccountsettings.html">
                    ⚙️ Account Settings
                </a>


                <button
                    type="button"
                    id="logoutButton"
                >
                    🚪 Logout
                </button>


            </div>


        </div>


    </header>



    <!-- =====================================================
         MAIN CONTENT
    ===================================================== -->

    <main class="main-content">


        <div class="page-header">


            <div>


                <span class="page-label">
                    CATERER
                </span>


                <h1>
                    My Events
                </h1>


                <p>
                    View your confirmed upcoming events.
                </p>


            </div>


            <a
                href="catererdashboard.html"
                class="dashboard-btn"
            >
                Dashboard
            </a>


        </div>



        <!-- =================================================
             EVENTS TABLE
        ================================================= -->

        <div class="table-container">


            <table>


                <thead>


                    <tr>

                        <th>
                            Event
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Guests
                        </th>

                        <th>
                            Location
                        </th>

                        <th>
                            Package
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>


                </thead>


                <tbody>



                            <span class="status">
                                Confirmed
                            </span>

                        </td>


                    </tr>


                </tbody>


            </table>


        </div>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

   <script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const caterer =
            JSON.parse(
                localStorage.getItem(
                    "annapriya_caterer"
                ) || "null"
            );


        if (!caterer) {

            window.location.href =
                "index.html";

            return;

        }


        const catererEmail =
            caterer.email ||
            "";


        const eventsBody =
            document.getElementById(
                "eventsBody"
            );


        /* =============================================
           LOAD EVENTS
        ============================================= */

        async function loadEvents() {

            try {

                eventsBody.innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            style="text-align:center;padding:35px;"
                        >
                            Loading your events...
                        </td>

                    </tr>

                `;


                const response =
                    await fetch(

                        `http://localhost:5000/api/requests/caterer/${encodeURIComponent(catererEmail)}/events`

                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not load events."
                    );

                }


                const events =
                    data.events || [];


                if (events.length === 0) {

                    eventsBody.innerHTML = `

                        <tr>

                            <td
                                colspan="8"
                                style="text-align:center;padding:40px;"
                            >

                                No confirmed events yet.

                            </td>

                        </tr>

                    `;

                    return;

                }


                eventsBody.innerHTML =
                    events
                        .map(event => `

                            <tr>

                                <td class="event-name">

                                    ${escapeHTML(
                                        event.event_type ||
                                        "Event"
                                    )}

                                </td>


                                <td>

                                    ${escapeHTML(
                                        event.customer_name
                                    )}

                                </td>


                                <td>

                                    ${formatDate(
                                        event.event_date
                                    )}

                                </td>


                                <td>

                                    ${escapeHTML(
                                        event.guest_count
                                    )}

                                </td>


                                <td>

                                    ${escapeHTML(
                                        event.venue_location
                                    )}

                                </td>


                                <td>

                                    ${escapeHTML(
                                        event.package_name ||
                                        "Not specified"
                                    )}

                                </td>


                                <td>

                                    ${escapeHTML(
                                        event.phone ||
                                        "Not available"
                                    )}

                                </td>


                                <td>

                                    <span class="status">

                                        ${formatStatus(
                                            event.status
                                        )}

                                    </span>

                                </td>

                            </tr>

                        `)
                        .join("");


            } catch (error) {

                console.error(
                    "Load events error:",
                    error
                );


                eventsBody.innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            style="text-align:center;padding:35px;"
                        >

                            Unable to load your events.

                            <br><br>

                            Make sure the backend server
                            is running.

                        </td>

                    </tr>

                `;

            }

        }


        /* =============================================
           HELPERS
        ============================================= */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function formatDate(value) {

            if (!value) {
                return "Not available";
            }


            const date =
                new Date(value);


            if (isNaN(date.getTime())) {
                return value;
            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        function formatStatus(status) {

            const value =
                String(status || "")
                    .toLowerCase();


            const names = {

                payment_pending:
                    "Payment Pending",

                confirmed:
                    "Confirmed",

                preparing:
                    "Preparing",

                on_the_way:
                    "On the Way",

                event_started:
                    "Event Started",

                completed:
                    "Completed"

            };


            return (
                names[value] ||
                status ||
                "Confirmed"
            );

        }


        /* =============================================
           HEADER
        ============================================= */

        const catererName =
            caterer.headName ||
            caterer.head_name ||
            caterer.name ||
            "Caterer";


        const headerName =
            document.getElementById(
                "headerCatererName"
            );


        const headerAvatar =
            document.getElementById(
                "headerAvatar"
            );


        if (headerName) {
            headerName.textContent =
                catererName;
        }


        if (headerAvatar) {
            headerAvatar.textContent =
                catererName
                    .charAt(0)
                    .toUpperCase();
        }


        /* =============================================
           LOAD
        ============================================= */

        loadEvents();

    });

</script>
