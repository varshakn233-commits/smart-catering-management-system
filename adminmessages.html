<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Annapriya | Admin Messages</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="customerdashboard.css"
    >

    <style>

        /* =====================================================
           PAGE
        ===================================================== */

        body {
            margin: 0;
            font-family: "Work Sans", sans-serif;
            background: #F5E9DA;
            color: #1C1C1C;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .messages-main {
            min-height: calc(100vh - 74px);
            padding: 45px 8%;
            box-sizing: border-box;
        }


        /* =====================================================
           PAGE HEADER
        ===================================================== */

        .page-header {
            margin-bottom: 30px;
        }

        .page-header .small-title {
            color: #8B1E3F;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-family: "Fraunces", serif;
            font-size: 42px;
            color: #1C1C1C;
        }

        .page-header p {
            margin: 0;
            color: #777;
            font-size: 15px;
        }


        /* =====================================================
           SUMMARY
        ===================================================== */

        .message-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(28, 28, 28, 0.07);
            border-left: 4px solid #8B1E3F;
        }

        .summary-card.unread {
            border-left-color: #D4A373;
        }

        .summary-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .summary-number {
            font-family: "Fraunces", serif;
            font-size: 30px;
            font-weight: 700;
            color: #8B1E3F;
        }


        /* =====================================================
           MESSAGE CONTAINER
        ===================================================== */

        .messages-container {
            background: #FFFFFF;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(28, 28, 28, 0.08);
        }


        /* =====================================================
           MESSAGE LIST
        ===================================================== */

        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }


        /* =====================================================
           MESSAGE ITEM
        ===================================================== */

        .message-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px;
            border: 1px solid #EEE4DA;
            border-radius: 14px;
            background: #FFFFFF;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .message-item:hover {
            background: #FAF6F1;
            border-color: #D4A373;
            transform: translateY(-1px);
        }

        .message-item.unread {
            background: #FFF9F2;
            border-left: 4px solid #8B1E3F;
        }


        /* =====================================================
           MESSAGE ICON
        ===================================================== */

        .message-icon {
            width: 52px;
            min-width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #F5E9DA;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }


        /* =====================================================
           MESSAGE CONTENT
        ===================================================== */

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-content h3 {
            margin: 0 0 5px;
            font-size: 15px;
            font-weight: 700;
            color: #1C1C1C;
        }

        .message-content p {
            margin: 0 0 6px;
            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }

        .message-date {
            font-size: 11px;
            color: #999;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .message-status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .message-status.unread {
            background: #F5E9DA;
            color: #8B1E3F;
        }

        .message-status.read {
            background: #EEF5EF;
            color: #2F7D4A;
        }


        /* =====================================================
           EMPTY STATE
        ===================================================== */

        .empty-state {
            text-align: center;
            padding: 70px 20px;
            color: #888;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            margin: 0 0 8px;
            color: #1C1C1C;
            font-family: "Fraunces", serif;
            font-size: 22px;
        }

        .empty-state p {
            margin: 0;
            font-size: 13px;
        }


        /* =====================================================
           MESSAGE MODAL
        ===================================================== */

        .message-modal {
            position: fixed;
            inset: 0;
            background: rgba(28, 28, 28, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .message-modal.show {
            display: flex;
        }

        .message-modal-content {
            width: min(600px, 100%);
            max-height: 85vh;
            overflow-y: auto;
            background: #FFFFFF;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           MODAL HEADER
        ===================================================== */

        .message-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 25px;
            background: #F5E9DA;
            border-bottom: 1px solid #EEE4DA;
        }

        .message-modal-header h2 {
            margin: 0;
            font-family: "Fraunces", serif;
            color: #8B1E3F;
            font-size: 23px;
        }

        .close-modal {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: #FFFFFF;
            color: #8B1E3F;
            font-size: 22px;
            cursor: pointer;
        }


        /* =====================================================
           MODAL BODY
        ===================================================== */

        .message-modal-body {
            padding: 25px;
        }

        .detail-group {
            margin-bottom: 20px;
        }

        .detail-label {
            display: block;
            font-size: 10px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .detail-value {
            background: #FAF7F3;
            border: 1px solid #EEE4DA;
            border-radius: 10px;
            padding: 13px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .message-text {
            white-space: pre-wrap;
            min-height: 100px;
        }


        /* =====================================================
           MODAL FOOTER
        ===================================================== */

        .message-modal-footer {
            padding: 18px 25px;
            border-top: 1px solid #EEE4DA;
            display: flex;
            justify-content: flex-end;
        }

        .close-button {
            border: none;
            background: #8B1E3F;
            color: #FFFFFF;
            padding: 11px 20px;
            border-radius: 8px;
            font-family: "Work Sans", sans-serif;
            font-weight: 600;
            cursor: pointer;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .messages-main {
                padding: 30px 20px;
            }

            .page-header h1 {
                font-size: 34px;
            }

            .message-summary {
                grid-template-columns: 1fr;
            }

            .message-item {
                align-items: flex-start;
            }

            .message-status {
                align-self: flex-start;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CATERER NAVBAR
    ===================================================== -->

    <header class="customer-navbar">

        <a
            href="catererdashboard.html"
            class="brand-logo"
        >

            <span class="brand-symbol">
                ✦
            </span>

            <span>
                Annapriya
            </span>

        </a>


        <div class="navbar-right">

            <button
                type="button"
                class="back-dashboard-button"
                onclick="window.location.href='catererdashboard.html'"
                title="Back to Dashboard"
            >
                ←
            </button>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main class="messages-main">


        <!-- PAGE HEADER -->

        <section class="page-header">

            <div class="small-title">
                Caterer Communication
            </div>

            <h1>
                Admin Messages
            </h1>

            <p>
                View messages and communication from Annapriya admin.
            </p>

        </section>


        <!-- =================================================
             SUMMARY
        ================================================== -->

        <section class="message-summary">

            <div class="summary-card">

                <div class="summary-label">
                    Total Messages
                </div>

                <div
                    class="summary-number"
                    id="totalMessages"
                >
                    0
                </div>

            </div>


            <div class="summary-card unread">

                <div class="summary-label">
                    Unread Messages
                </div>

                <div
                    class="summary-number"
                    id="unreadMessages"
                >
                    0
                </div>

            </div>

        </section>


        <!-- =================================================
             MESSAGE LIST
        ================================================== -->

        <section class="messages-container">

            <div
                class="messages-list"
                id="messagesList"
            >

                <div class="loading-state">

                    Loading messages...

                </div>

            </div>

        </section>


    </main>


    <!-- =====================================================
         MESSAGE MODAL
    ===================================================== -->

    <div
        class="message-modal"
        id="messageModal"
    >

        <div class="message-modal-content">


            <div class="message-modal-header">

                <h2>
                    Admin Message
                </h2>

                <button
                    type="button"
                    class="close-modal"
                    id="closeMessageModal"
                >
                    ×
                </button>

            </div>


            <div class="message-modal-body">


                <div class="detail-group">

                    <span class="detail-label">
                        Subject
                    </span>

                    <div
                        class="detail-value"
                        id="modalSubject"
                    >
                        —
                    </div>

                </div>


                <div class="detail-group">

                    <span class="detail-label">
                        Related Complaint
                    </span>

                    <div
                        class="detail-value"
                        id="modalComplaint"
                    >
                        —
                    </div>

                </div>


                <div class="detail-group">

                    <span class="detail-label">
                        Message
                    </span>

                    <div
                        class="detail-value message-text"
                        id="modalMessage"
                    >
                        —
                    </div>

                </div>


                <div class="detail-group">

                    <span class="detail-label">
                        Received
                    </span>

                    <div
                        class="detail-value"
                        id="modalDate"
                    >
                        —
                    </div>

                </div>


            </div>


            <div class="message-modal-footer">

                <button
                    type="button"
                    class="close-button"
                    id="closeMessageButton"
                >
                    Close
                </button>

            </div>


        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                // =====================================================
                // CATERER DATA
                // =====================================================

                let caterer = null;

                try {

                    caterer = JSON.parse(
                        localStorage.getItem(
                            "annapriya_caterer"
                        ) || "null"
                    );

                } catch (error) {

                    console.error(
                        "Could not read caterer data:",
                        error
                    );

                }


                // =====================================================
                // GET CATERER ID
                // =====================================================

                const catererId =
                    caterer?.id ||
                    caterer?.caterer_id ||
                    null;


                if (!catererId) {

                    document.getElementById(
                        "messagesList"
                    ).innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">
                                ⚠️
                            </div>

                            <h3>
                                Caterer account not found
                            </h3>

                            <p>
                                Please log in again to view your messages.
                            </p>

                        </div>

                    `;

                    return;

                }


                // =====================================================
                // ELEMENTS
                // =====================================================

                const messagesList =
                    document.getElementById(
                        "messagesList"
                    );

                const totalMessages =
                    document.getElementById(
                        "totalMessages"
                    );

                const unreadMessages =
                    document.getElementById(
                        "unreadMessages"
                    );

                const messageModal =
                    document.getElementById(
                        "messageModal"
                    );

                const closeMessageModal =
                    document.getElementById(
                        "closeMessageModal"
                    );

                const closeMessageButton =
                    document.getElementById(
                        "closeMessageButton"
                    );


                // =====================================================
                // FORMAT DATE
                // =====================================================

                function formatDate(value) {

                    if (!value) {
                        return "Date not available";
                    }

                    const date =
                        new Date(value);

                    if (
                        isNaN(
                            date.getTime()
                        )
                    ) {
                        return value;
                    }

                    return date.toLocaleString(
                        "en-IN",
                        {
                            day: "2-digit",
                            month: "short",
                            year: "numeric",
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );

                }


                // =====================================================
                // ESCAPE HTML
                // =====================================================

                function escapeHTML(value) {

                    if (
                        value === null ||
                        value === undefined
                    ) {
                        return "";
                    }

                    return String(value)
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }


                // =====================================================
                // LOAD MESSAGES
                // =====================================================

                async function loadMessages() {

                    try {

                        const response =
                            await fetch(
                                `http://localhost:5000/api/admin-caterer-messages/caterer/${encodeURIComponent(catererId)}`
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                data.message ||
                                "Could not load messages."
                            );

                        }


                        const messages =
                            data.messages || [];


                        // =================================================
                        // SUMMARY
                        // =================================================

                        const unreadCount =
                            messages.filter(
                                message =>
                                    message.status ===
                                    "unread"
                            ).length;


                        totalMessages.textContent =
                            messages.length;

                        unreadMessages.textContent =
                            unreadCount;


                        // =================================================
                        // EMPTY
                        // =================================================

                        if (
                            messages.length === 0
                        ) {

                            messagesList.innerHTML = `

                                <div class="empty-state">

                                    <div class="empty-icon">
                                        💌
                                    </div>

                                    <h3>
                                        No Admin Messages
                                    </h3>

                                    <p>
                                        Messages from Annapriya admin will appear here.
                                    </p>

                                </div>

                            `;

                            return;

                        }


                        // =================================================
                        // RENDER
                        // =================================================

                        messagesList.innerHTML =
                            messages
                                .map(
                                    message => `

                                    <div
                                        class="message-item ${
                                            message.status === "unread"
                                                ? "unread"
                                                : ""
                                        }"
                                        data-message-id="${message.message_id}"
                                    >

                                        <div class="message-icon">
                                            💌
                                        </div>


                                        <div class="message-content">

                                            <h3>
                                                ${escapeHTML(
                                                    message.subject ||
                                                    "Admin Message"
                                                )}
                                            </h3>

                                            <p>
                                                ${escapeHTML(
                                                    message.message
                                                )}
                                            </p>

                                            <span class="message-date">

                                                ${formatDate(
                                                    message.created_at
                                                )}

                                            </span>

                                        </div>


                                        <span
                                            class="message-status ${
                                                message.status === "unread"
                                                    ? "unread"
                                                    : "read"
                                            }"
                                        >

                                            ${
                                                message.status === "unread"
                                                    ? "Unread"
                                                    : "Read"
                                            }

                                        </span>

                                    </div>

                                `
                                )
                                .join("");


                        // =================================================
                        // CLICK MESSAGE
                        // =================================================

                        messagesList
                            .querySelectorAll(
                                ".message-item"
                            )
                            .forEach(
                                item => {

                                    item.addEventListener(
                                        "click",
                                        () => {

                                            const messageId =
                                                item.dataset.messageId;

                                            const selectedMessage =
                                                messages.find(
                                                    message =>
                                                        String(
                                                            message.message_id
                                                        ) ===
                                                        String(
                                                            messageId
                                                        )
                                                );


                                            if (
                                                selectedMessage
                                            ) {

                                                openMessage(
                                                    selectedMessage
                                                );

                                            }

                                        }
                                    );

                                }
                            );

                    }

                    catch (error) {

                        console.error(
                            "Admin messages error:",
                            error
                        );


                        messagesList.innerHTML = `

                            <div class="empty-state">

                                <div class="empty-icon">
                                    ⚠️
                                </div>

                                <h3>
                                    Could not load messages
                                </h3>

                                <p>
                                    Make sure the backend server is running.
                                </p>

                            </div>

                        `;

                    }

                }


                // =====================================================
                // OPEN MESSAGE
                // =====================================================

                async function openMessage(
                    message
                ) {

                    document.getElementById(
                        "modalSubject"
                    ).textContent =
                        message.subject ||
                        "Admin Message";


                    document.getElementById(
                        "modalComplaint"
                    ).textContent =
                        message.complaint_id
                            ? `Complaint #${message.complaint_id}`
                            : "No related complaint";


                    document.getElementById(
                        "modalMessage"
                    ).textContent =
                        message.message ||
                        "No message available.";


                    document.getElementById(
                        "modalDate"
                    ).textContent =
                        formatDate(
                            message.created_at
                        );


                    messageModal.classList.add(
                        "show"
                    );


                    // =================================================
                    // MARK AS READ
                    // =================================================

                    if (
                        message.status ===
                        "unread"
                    ) {

                        try {

                            await fetch(
                                `http://localhost:5000/api/admin-caterer-messages/${message.message_id}/read`,
                                {
                                    method: "PUT"
                                }
                            );


                            message.status =
                                "read";


                            loadMessages();

                        }

                        catch (error) {

                            console.error(
                                "Mark message as read error:",
                                error
                            );

                        }

                    }

                }


                // =====================================================
                // CLOSE MODAL
                // =====================================================

                function closeModal() {

                    messageModal.classList.remove(
                        "show"
                    );

                }


                closeMessageModal.addEventListener(
                    "click",
                    closeModal
                );


                closeMessageButton.addEventListener(
                    "click",
                    closeModal
                );


                messageModal.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target ===
                            messageModal
                        ) {

                            closeModal();

                        }

                    }
                );


                document.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                            "Escape"
                        ) {

                            closeModal();

                        }

                    }
                );


                // =====================================================
                // START
                // =====================================================

                loadMessages();

            }
        );

    </script>


</body>

</html>
