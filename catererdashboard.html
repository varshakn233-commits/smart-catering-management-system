<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Caterer Dashboard | Annapriya</title>


    <link
        rel="stylesheet"
        href="catererdashboard.css"
    >


    <style>

        /* =====================================================
           HEADER
        ===================================================== */

        .customer-header {

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: relative;

            width: 100%;

            box-sizing: border-box;

        }


        .header-left {

            display: flex;
            align-items: center;

            gap: 15px;

        }


        .header-right {

            position: relative;

            display: flex;
            align-items: center;

            gap: 12px;

        }



        /* =====================================================
           NOTIFICATION BUTTON
        ===================================================== */

        .notification-button {

            width: 40px;
            height: 40px;

            border: none;

            border-radius: 50%;

            background: #F5E9DA;

            color: #8B1E3F;

            font-size: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .notification-button:hover {

            background: #8B1E3F;

            color: #FFFFFF;

        }



        /* =====================================================
           CATERER NAME
        ===================================================== */

        .caterer-header-info {

            display: flex;

            align-items: center;

            gap: 8px;

            cursor: default;

        }


        .avatar {

            width: 38px;
            height: 38px;

            border-radius: 50%;

            background: #8B1E3F;

            color: #FFFFFF;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 14px;

            font-weight: 600;

        }


        .customer-name {

            color: #1C1C1C;

            font-size: 14px;

            font-weight: 600;

            white-space: nowrap;

        }



        /* =====================================================
           THREE DOT BUTTON
        ===================================================== */

        .dots-button {

            width: 40px;
            height: 40px;

            border: none;

            background: transparent;

            border-radius: 50%;

            color: #1C1C1C;

            font-size: 26px;

            line-height: 1;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            transition: 0.2s ease;

        }


        .dots-button:hover {

            background: #F5E9DA;

            color: #8B1E3F;

        }


        .dots-button:focus {

            outline: none;

        }



        /* =====================================================
           DROPDOWN MENU
        ===================================================== */

        .profile-menu {

            position: absolute;

            top: 50px;

            right: 0;

            width: 220px;

            background: #FFFFFF;

            border-radius: 12px;

            padding: 8px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);

            display: none;

            z-index: 9999;

        }


        .profile-menu.show {

            display: block;

        }


        .profile-menu a,
        .profile-menu button {

            width: 100%;

            box-sizing: border-box;

            display: block;

            padding: 11px 13px;

            border: none;

            background: transparent;

            color: #1C1C1C;

            text-decoration: none;

            text-align: left;

            border-radius: 8px;

            font-family: inherit;

            font-size: 14px;

            cursor: pointer;

        }


        .profile-menu a:hover,
        .profile-menu button:hover {

            background: #F5E9DA;

            color: #8B1E3F;

        }



        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .main-content {

            width: 100%;

            box-sizing: border-box;

        }


        .page-heading {

            margin-bottom: 38px;

        }


        .page-heading h1 {

            margin-top: 10px;

            margin-bottom: 10px;

            color: #8B1E3F;

        }


        .page-heading p {

            color: #555555;

            line-height: 1.6;

            max-width: 650px;

        }



        /* =====================================================
           QUICK LINKS
        ===================================================== */

        .quick-links-section {

            width: 100%;

            max-width: 900px;

        }


        .quick-links-title {

            color: #8B1E3F;

            font-size: 20px;

            margin-bottom: 18px;

        }


        .quick-links {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 18px;

        }


        .quick-link {

            background: #FFFFFF;

            border-radius: 12px;

            padding: 24px;

            text-decoration: none;

            color: #1C1C1C;

            display: flex;

            align-items: center;

            gap: 14px;

            border: 1px solid #F0E4D5;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.07);

            transition: 0.2s ease;

        }


        .quick-link:hover {

            transform: translateY(-3px);

            border-color: #D4A373;

        }


        .quick-icon {

            width: 48px;
            height: 48px;

            border-radius: 10px;

            background: #F5E9DA;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 23px;

        }


        .quick-link span {

            font-size: 15px;

            font-weight: 600;

        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .quick-links {

                grid-template-columns: 1fr;

            }


            .customer-name {

                display: none;

            }

        }

    </style>

</head>



<body>



<!-- =====================================================
     HEADER
====================================================== -->

<header class="customer-header">


    <!-- LEFT SIDE -->

    <div class="header-left">


        <button
            class="back-button"
            id="backButton"
            type="button"
        >

            ←

        </button>


        <div class="brand-name">

            Annapriya

        </div>


    </div>



    <!-- RIGHT SIDE -->

    <div class="header-right">


        <!-- NOTIFICATION -->

        <button
            class="notification-button"
            id="notificationButton"
            type="button"
            title="Notifications"
        >

            🔔

        </button>



        <!-- CATERER NAME -->

        <div class="caterer-header-info">


            <span
                class="avatar"
                id="headerAvatar"
            >

                C

            </span>


            <span
                class="customer-name"
                id="headerCatererName"
            >

                Caterer

            </span>


        </div>



        <!-- THREE DOTS -->

        <button
            class="dots-button"
            id="profileButton"
            type="button"
            title="Menu"
            aria-label="Open menu"
        >

            ⋮

        </button>



        <!-- DROPDOWN MENU -->

        <div
            class="profile-menu"
            id="profileButtonMenu"
        >


            <a href="catererprofile.html">

                👤 My Profile

            </a>


            <a href="catererprofile.html">

                ✏️ Edit Profile

            </a>


            <a href="catererreviews.html">

                ⭐ My Reviews

            </a>


            <a href="catereraccountsettings.html">

                ⚙️ Account Settings

            </a>


            <button
                type="button"
                id="logoutButton"
            >

                🚪 Logout

            </button>


        </div>


    </div>


</header>



<!-- =====================================================
     MAIN CONTENT
====================================================== -->

<main class="main-content">


    <!-- GREETING -->

    <section class="page-heading">


        <span class="page-label">

            CATERER

        </span>


        <h1>

            Welcome back,

            <span id="catererName">

                Caterer

            </span>

            👋

        </h1>


        <p>

            Here's your business overview and quick access
            to your catering management.

        </p>


    </section>



    <!-- =================================================
         QUICK LINKS
    ================================================== -->

    <section class="quick-links-section">


        <h2 class="quick-links-title">

            Quick Links

        </h2>


        <div class="quick-links">


            <!-- EVENT REQUESTS -->

            <a
                href="catererrequests.html"
                class="quick-link"
            >

                <div class="quick-icon">

                    📋

                </div>


                <span>

                    Event Requests

                </span>

            </a>



            <!-- MY EVENTS -->

            <a
                href="catererevents.html"
                class="quick-link"
            >

                <div class="quick-icon">

                    📅

                </div>


                <span>

                    My Events

                </span>

            </a>


        </div>


    </section>


</main>



<!-- =====================================================
     DROPDOWN + HEADER JAVASCRIPT
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =================================================
           GET CATERER INFORMATION
        ================================================= */

        let caterer = {};

        try {

            caterer = JSON.parse(
                localStorage.getItem(
                    "annapriya_caterer"
                ) || "{}"
            );

        } catch (error) {

            caterer = {};

        }


        const catererName =

            caterer.headName ||

            caterer.head_name ||

            caterer.fullName ||

            caterer.full_name ||

            caterer.name ||

            "Caterer";



        /* =================================================
           DISPLAY CATERER NAME
        ================================================= */

        const nameElement =
            document.getElementById(
                "catererName"
            );


        const headerName =
            document.getElementById(
                "headerCatererName"
            );


        const avatar =
            document.getElementById(
                "headerAvatar"
            );


        if (nameElement) {

            nameElement.textContent =
                catererName;

        }


        if (headerName) {

            headerName.textContent =
                catererName;

        }


        if (avatar) {

            avatar.textContent =
                catererName
                    .charAt(0)
                    .toUpperCase();

        }



        /* =================================================
           THREE DOT DROPDOWN
        ================================================= */

        const profileButton =
            document.getElementById(
                "profileButton"
            );


        const profileMenu =
            document.getElementById(
                "profileButtonMenu"
            );


        if (
            profileButton &&
            profileMenu
        ) {


            profileButton.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    profileMenu.classList.toggle(
                        "show"
                    );

                }
            );


            /* CLOSE WHEN CLICKING OUTSIDE */

            document.addEventListener(
                "click",
                function (event) {

                    if (
                        !profileMenu.contains(
                            event.target
                        ) &&
                        !profileButton.contains(
                            event.target
                        )
                    ) {

                        profileMenu.classList.remove(
                            "show"
                        );

                    }

                }
            );

        }



        /* =================================================
           NOTIFICATION BUTTON
        ================================================= */

        const notificationButton =
            document.getElementById(
                "notificationButton"
            );


        if (notificationButton) {

            notificationButton.addEventListener(
                "click",
                function () {

                    alert(
                        "No new notifications."
                    );

                }
            );

        }



        /* =================================================
           LOGOUT
        ================================================= */

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );


        if (logoutButton) {

            logoutButton.addEventListener(
                "click",
                function () {


                    localStorage.removeItem(
                        "annapriya_caterer_token"
                    );


                    localStorage.removeItem(
                        "annapriya_caterer"
                    );


                    window.location.href =
                        "index.html";

                }
            );

        }



        /* =================================================
           BACK BUTTON
        ================================================= */

        const backButton =
            document.getElementById(
                "backButton"
            );


        if (backButton) {

            backButton.addEventListener(
                "click",
                function () {

                    window.history.back();

                }
            );

        }

    }

);

</script>



</body>

</html>
