<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Annapriya</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Work Sans", sans-serif;
            background: #F5E9DA;
            color: #1C1C1C;
            min-height: 100vh;
        }
        header {
            background: #1C1C1C;
            color: #FFFDF9;
            padding: 20px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h2 { font-family: "Fraunces", serif; }
        header a {
            color: #D4A373;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .welcome-box {
            max-width: 700px;
            margin: 70px auto;
            background: #FFFDF9;
            padding: 50px 40px;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(28,20,17,0.08);
        }
        .welcome-box h1 {
            font-family: "Fraunces", serif;
            font-weight: 500;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .welcome-box h1 span { color: #8B1E3F; font-style: italic; }
        .welcome-box p { color: #7a6f62; margin-bottom: 30px; }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px dashed #e2d3ba;
            font-size: 14px;
        }
        .info-row span:first-child { color: #7a6f62; }
        .info-row span:last-child { font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <h2>🪔 Annapriya</h2>
        <a onclick="logout()">Logout</a>
    </header>

    <div class="welcome-box">
        <h1>Welcome back, <span id="customerName">Guest</span> 👋</h1>
        <p>Here's your account overview.</p>

        <div class="info-row"><span>Name</span><span id="infoName">-</span></div>
        <div class="info-row"><span>Email</span><span id="infoEmail">-</span></div>
    </div>

    <script>
        // Protect this page — if there's no token, send them back to login
        const token = localStorage.getItem("annapriya_token");
        const customer = JSON.parse(localStorage.getItem("annapriya_customer") || "null");

        if (!token || !customer) {
            window.location.href = "index.html";
        } else {
            document.getElementById("customerName").textContent = customer.fullName;
            document.getElementById("infoName").textContent = customer.fullName;
            document.getElementById("infoEmail").textContent = customer.email;
        }

        function logout() {
            localStorage.removeItem("annapriya_token");
            localStorage.removeItem("annapriya_customer");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
