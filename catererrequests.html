<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Requests | Annapriya</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #F5E9DA;
            color: #1C1C1C;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #8B1E3F;
            color: white;
            padding: 25px 18px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 8px;
        }

        .nav-menu a {
            display: block;
            text-decoration: none;
            color: white;
            padding: 13px 15px;
            border-radius: 10px;
            transition: 0.2s;
            font-size: 15px;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: rgba(255,255,255,0.15);
        }

        /* ================= MAIN ================= */

        .main-content {
            margin-left: 250px;
            padding: 35px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: #8B1E3F;
            font-size: 30px;
        }

        .page-header p {
            color: #666;
            margin-top: 5px;
        }

        .logout-btn {
            border: none;
            background: #8B1E3F;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #6f1732;
        }

        /* ================= TABLE ================= */

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }

        th {
            background: #8B1E3F;
            color: white;
            padding: 14px 12px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            vertical-align: middle;
        }

        tr:hover td {
            background: #fffaf5;
        }

        /* ================= STATUS ================= */

        .status {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: capitalize;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.accepted {
            background: #d4edda;
            color: #155724;
        }

        .status.payment_pending {
            background: #dbeafe;
            color: #1e40af;
        }

        .status.confirmed {
            background: #d1fae5;
            color: #065f46;
        }

        .status.preparing {
            background: #ede9fe;
            color: #5b21b6;
        }

        .status.on_the_way {
            background: #cffafe;
            color: #155e75;
        }

        .status.event_started {
            background: #fef3c7;
            color: #92400e;
        }

        .status.completed {
            background: #dcfce7;
            color: #166534;
        }

        .status.rejected {
            background: #f8d7da;
            color: #721c24;
        }

        /* ================= ACTION BUTTONS ================= */

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .action-btn.accept {
            background: #d4edda;
            color: #155724;
        }

        .action-btn.accept:hover {
            background: #b9dfc2;
        }

        .action-btn.reject {
            background: #f8d7da;
            color: #721c24;
        }

        .action-btn.reject:hover {
            background: #f1bfc4;
        }

        .action-btn:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        /* ================= LOADING ================= */

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty {
            text-align: center;
            padding: 45px;
            color: #777;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 900px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .logo {
                margin-bottom: 15px;
            }

            .nav-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
            }

            .nav-menu li {
                margin-bottom: 0;
            }

            .nav-menu a {
                padding: 10px 12px;
                font-size: 13px;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            Annapriya
        </div>

        <ul class="nav-menu">

            <li>
                <a href="catererdashboard.html">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a href="catererrequests.html" class="active">
                    📋 Event Requests
                </a>
            </li>

            <li>
                <a href="caterercustomers.html">
                    👥 Customers
                </a>
            </li>

            <li>
                <a href="catererevents.html">
                    📅 Events
                </a>
            </li>

            <li>
                <a href="caterer-profile.html">
                    👤 My Profile
                </a>
            </li>

        </ul>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <div class="page-header">

            <div>
                <h1>Event Requests</h1>

                <p>
                    View and manage customer event requests.
                </p>
            </div>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


        <!-- ================= REQUEST TABLE ================= -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Customer</th>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Guests</th>
                        <th>Venue</th>
                        <th>Package</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="requestsBody">

                    <tr>
                        <td
                            colspan="8"
                            class="loading"
                        >
                            Loading requests...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* ============================================
           CHECK CATERER LOGIN
        ============================================ */

        const token =
            localStorage.getItem("annapriya_caterer_token");

        if (!token) {

            window.location.href = "index.html";

        }


        /* ============================================
           GET CATERER INFORMATION
        ============================================ */

        const caterer =
            JSON.parse(
                localStorage.getItem("annapriya_caterer") || "null"
            );


        /*
            Different login versions may store
            the caterer ID using different property names.

            So we safely check all possible names.
        */

        const catererId =
            caterer?.catererId ||
            caterer?.caterer_id ||
            caterer?.id ||
            null;


        console.log("Logged-in caterer:", caterer);
        console.log("Caterer ID:", catererId);


        /* ============================================
           LOAD EVENT REQUESTS
        ============================================ */

        async function loadRequests() {

            const requestsBody =
                document.getElementById("requestsBody");

            requestsBody.innerHTML = `
                <tr>
                    <td colspan="8" class="loading">
                        Loading requests...
                    </td>
                </tr>
            `;

            try {

                const response = await fetch(
                    "http://localhost:5000/api/requests"
                );


                const data = await response.json();


                console.log("Requests response:", data);


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not fetch requests."
                    );

                }


                const requests =
                    data.requests || [];


                /* ====================================
                   NO REQUESTS
                ==================================== */

                if (requests.length === 0) {

                    requestsBody.innerHTML = `
                        <tr>
                            <td colspan="8" class="empty">
                                No event requests found.
                            </td>
                        </tr>
                    `;

                    return;
                }


                /* ====================================
                   DISPLAY REQUESTS
                ==================================== */

                requestsBody.innerHTML =
                    requests.map(request => {


                        const status =
                            request.status || "pending";


                        /*
                            Status class:
                            payment_pending etc.
                            are already valid CSS class names.
                        */

                        const statusClass =
                            status.toLowerCase();


                        /*
                            Only pending requests can be
                            accepted or rejected.
                        */

                        const isPending =
                            status === "pending";


                        return `

                            <tr>

                                <!-- CUSTOMER -->

                                <td>
                                    <strong>
                                        ${
                                            request.customer_name ||
                                            "Unknown Customer"
                                        }
                                    </strong>
                                </td>


                                <!-- EVENT -->

                                <td>
                                    ${
                                        request.event_type ||
                                        "-"
                                    }
                                </td>


                                <!-- DATE -->

                                <td>
                                    ${
                                        formatDate(
                                            request.event_date
                                        )
                                    }
                                </td>


                                <!-- GUESTS -->

                                <td>
                                    ${
                                        request.guest_count ||
                                        "-"
                                    }
                                </td>


                                <!-- VENUE -->

                                <td>
                                    ${
                                        request.venue_location ||
                                        "-"
                                    }
                                </td>


                                <!-- PACKAGE -->

                                <td>
                                    ${
                                        request.package_name ||
                                        "-"
                                    }
                                </td>


                                <!-- STATUS -->

                                <td>

                                    <span
                                        class="status ${statusClass}"
                                    >
                                        ${formatStatus(status)}
                                    </span>

                                </td>


                                <!-- ACTION -->

                                <td>

                                    <div class="actions">

                                        <button
                                            class="action-btn accept"
                                            title="Accept Request"
                                            onclick="updateRequest(
                                                ${request.request_id},
                                                'accepted'
                                            )"
                                            ${
                                                !isPending
                                                    ? "disabled"
                                                    : ""
                                            }
                                        >
                                            ✓
                                        </button>


                                        <button
                                            class="action-btn reject"
                                            title="Reject Request"
                                            onclick="updateRequest(
                                                ${request.request_id},
                                                'rejected'
                                            )"
                                            ${
                                                !isPending
                                                    ? "disabled"
                                                    : ""
                                            }
                                        >
                                            ✕
                                        </button>

                                    </div>

                                </td>

                            </tr>

                        `;

                    }).join("");


            } catch (error) {

                console.error(
                    "Load requests error:",
                    error
                );


                requestsBody.innerHTML = `
                    <tr>
                        <td
                            colspan="8"
                            class="empty"
                        >
                            Unable to load event requests.
                            <br><br>
                            Please make sure the backend server is running.
                        </td>
                    </tr>
                `;

            }

        }


        /* ============================================
           UPDATE REQUEST STATUS
        ============================================ */

        async function updateRequest(
            requestId,
            newStatus
        ) {

            console.log(
                "Updating request:",
                requestId,
                newStatus
            );


            /* ========================================
               CHECK REQUEST ID
            ======================================== */

            if (!requestId) {

                alert(
                    "Request ID is missing."
                );

                return;
            }


            /* ========================================
               CHECK CATERER ID
            ======================================== */

            if (!catererId) {

                alert(
                    "Caterer information was not found. " +
                    "Please log out and log in again."
                );

                console.error(
                    "Caterer ID missing.",
                    caterer
                );

                return;
            }


            /* ========================================
               CONFIRM ACTION
            ======================================== */

            const actionText =
                newStatus === "accepted"
                    ? "accept"
                    : "reject";


            const confirmed =
                confirm(
                    `Are you sure you want to ${actionText} this request?`
                );


            if (!confirmed) {

                return;

            }


            try {

                /* ====================================
                   SEND REQUEST TO BACKEND
                ==================================== */

                const response = await fetch(
                    `http://localhost:5000/api/requests/${requestId}/status`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            status: newStatus,

                            catererId: catererId

                        })

                    }
                );


                /* ====================================
                   READ RESPONSE
                ==================================== */

                const data =
                    await response.json();


                console.log(
                    "Update response:",
                    data
                );


                /* ====================================
                   BACKEND ERROR
                ==================================== */

                if (!response.ok) {

                    alert(
                        data.message ||
                        "Could not update request."
                    );

                    return;

                }


                /* ====================================
                   SUCCESS
                ==================================== */

                alert(
                    data.message ||
                    "Request updated successfully."
                );


                /* ====================================
                   RELOAD REQUESTS
                ==================================== */

                await loadRequests();


            } catch (error) {

                console.error(
                    "Update request error:",
                    error
                );


                alert(
                    "Unable to connect to backend. " +
                    "Please make sure the server is running."
                );

            }

        }


        /* ============================================
           FORMAT STATUS
        ============================================ */

        function formatStatus(status) {

            if (!status) {
                return "Pending";
            }


            return status
                .replaceAll("_", " ")
                .replace(/\b\w/g, letter =>
                    letter.toUpperCase()
                );

        }


        /* ============================================
           FORMAT DATE
        ============================================ */

        function formatDate(dateValue) {

            if (!dateValue) {

                return "-";

            }


            const date =
                new Date(dateValue);


            if (isNaN(date.getTime())) {

                return dateValue;

            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        /* ============================================
           LOGOUT
        ============================================ */

        function logout() {

            localStorage.removeItem(
                "annapriya_caterer_token"
            );

            localStorage.removeItem(
                "annapriya_caterer"
            );

            window.location.href =
                "index.html";

        }


        /* ============================================
           LOAD REQUESTS WHEN PAGE OPENS
        ============================================ */

        loadRequests();

    </script>

</body>
</html>
