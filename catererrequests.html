<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Requests | Annapriya</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5e9da;
            color: #1c1c1c;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #1c1c1c;
            color: white;
            padding: 25px 18px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #d4a373;
            margin-bottom: 35px;
            text-align: center;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-links a,
        .bottom-links a {
            text-decoration: none;
            color: #ddd;
            padding: 13px 15px;
            border-radius: 8px;
            display: block;
        }

        .nav-links a:hover,
        .nav-links a.active,
        .bottom-links a:hover {
            background: #8b1e3f;
            color: white;
        }

        .bottom-links {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .logout {
            color: #ffb3b3 !important;
        }

        .main {
            margin-left: 240px;
            padding: 35px 45px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top-bar h1 {
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-top: 6px;
        }

        .dashboard-btn {
            background: #8b1e3f;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #1c1c1c;
            color: white;
            padding: 15px 12px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #faf7f2;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #fff3cd;
            color: #856404;
        }

        .status.accepted {
            background: #d4edda;
            color: #155724;
        }

        .status.rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
        }

        .accept {
            background: #d4edda;
            color: #155724;
        }

        .reject {
            background: #f8d7da;
            color: #721c24;
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        @media (max-width: 800px) {
            .sidebar {
                position: static;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">

        <div class="logo">ANNAPRIYA</div>

        <nav class="nav-links">
            <a href="catererdashboard.html">Dashboard</a>
            <a href="catererpackages.html">My Packages</a>
            <a href="catererrequests.html" class="active">Event Requests</a>
            <a href="catererevents.html">My Events</a>
            <a href="caterercustomers.html">My Customers</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="bottom-links">
            <a href="caterer-profile.html">👤 Caterer Profile</a>
            <a href="#" class="logout" onclick="logout()">↪ Logout</a>
        </div>

    </aside>


    <main class="main">

        <div class="top-bar">
            <div>
                <h1>Event Requests</h1>
                <p class="subtitle">
                    Review and manage customer event requests.
                </p>
            </div>

            <a href="catererdashboard.html" class="dashboard-btn">
                Dashboard
            </a>
        </div>


        <div class="table-card">

            <table>

                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Guests</th>
                        <th>Location</th>
                        <th>Package</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

             <tbody id="requestsBody">
</tbody>

            </table>

        </div>

    </main>


    <script>

const token =
    localStorage.getItem("annapriya_caterer_token");

if (!token) {
    window.location.href = "index.html";
}


const caterer =
    JSON.parse(
        localStorage.getItem("annapriya_caterer") || "null"
    );


const catererId =
    caterer ? caterer.id : null;


async function loadRequests() {

    try {

        const response = await fetch(
            "http://localhost:5000/api/requests"
        );

        const data = await response.json();


        if (!response.ok) {
            alert(
                data.message ||
                "Could not load requests."
            );
            return;
        }


        const tbody =
            document.getElementById("requestsBody");


        tbody.innerHTML = "";


        data.requests.forEach(request => {

            const row =
                document.createElement("tr");


            let statusClass = "";

            if (request.status === "accepted") {
                statusClass = "accepted";
            }

            if (request.status === "rejected") {
                statusClass = "rejected";
            }


            const formattedDate =
                request.event_date
                    ? new Date(request.event_date)
                        .toLocaleDateString("en-IN")
                    : "-";


            row.innerHTML = `

                <td>${request.customer_name}</td>

                <td>Event Request</td>

                <td>${formattedDate}</td>

                <td>-</td>

                <td>-</td>

                <td>-</td>

                <td>
                    <span class="status ${statusClass}">
                        ${request.status}
                    </span>
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="action-btn accept"
                            onclick="updateRequest(${request.request_id}, 'accepted')"
                            ${request.status !== "pending" ? "disabled" : ""}
                        >
                            ✓
                        </button>

                        <button
                            class="action-btn reject"
                            onclick="updateRequest(${request.request_id}, 'rejected')"
                            ${request.status !== "pending" ? "disabled" : ""}
                        >
                            ✕
                        </button>

                    </div>

                </td>
            `;


            tbody.appendChild(row);

        });


    } catch (error) {

        console.error(
            "Load requests error:",
            error
        );

        alert(
            "Could not connect to backend."
        );
    }
}



async function updateRequest(requestId, newStatus) {

    try {

        const response = await fetch(
            `http://localhost:5000/api/requests/${requestId}/status`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: newStatus,
                    catererId: catererId
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Could not update request."
            );

            return;
        }


        alert(
            data.message
        );


        loadRequests();


    } catch (error) {

        console.error(
            "Update request error:",
            error
        );

        alert(
            "Unable to connect to backend."
        );
    }
}



function logout() {

    localStorage.removeItem(
        "annapriya_caterer_token"
    );

    localStorage.removeItem(
        "annapriya_caterer"
    );

    window.location.href =
        "index.html";
}


loadRequests();

</script>

</body>
</html>
