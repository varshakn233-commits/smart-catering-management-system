<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Requests | Annapriya</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Work Sans", sans-serif;
            background: #F5E9DA;
            color: #1C1C1C;
            min-height: 100vh;
        }

        /* HEADER */

        .header {
            height: 90px;
            background: #FFFDF9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid #eadfd3;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-button {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #F5E9DA;
            color: #8B1E3F;
            font-size: 25px;
            cursor: pointer;
        }

        .brand {
            font-family: "Fraunces", serif;
            font-size: 32px;
            font-weight: 700;
            color: #8B1E3F;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .notification-button,
        .menu-button {
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .notification-button {
            font-size: 23px;
            position: relative;
        }

        .notification-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background: #8B1E3F;
            border-radius: 50%;
            display: none;
        }

        .profile-button {
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #8B1E3F;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .menu-button {
            font-size: 28px;
            color: #1C1C1C;
        }

        /* DROPDOWN */

        .dropdown {
            position: absolute;
            right: 30px;
            top: 78px;
            width: 220px;
            background: #FFFDF9;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            padding: 10px;
            display: none;
            z-index: 1000;
        }

        .dropdown.show {
            display: block;
        }

        .dropdown a {
            display: block;
            text-decoration: none;
            color: #1C1C1C;
            padding: 12px 14px;
            border-radius: 8px;
        }

        .dropdown a:hover {
            background: #F5E9DA;
            color: #8B1E3F;
        }

        .dropdown .logout {
            color: #8B1E3F;
            font-weight: 600;
        }

        /* MAIN */

        .main {
            max-width: 1250px;
            margin: auto;
            padding: 60px 35px;
        }

        .small-heading {
            color: #D4A373;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: "Fraunces", serif;
            font-size: 46px;
            color: #8B1E3F;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 35px;
        }

        /* MESSAGES */

        .message {
            background: #FFFDF9;
            padding: 22px;
            border-radius: 12px;
            text-align: center;
            color: #777;
            margin-bottom: 20px;
        }

        .error-message {
            color: #8B1E3F;
            display: none;
        }

        #loadingMessage {
            display: none;
        }

        #emptyMessage {
            display: none;
        }

        /* REQUEST GRID */

        .requests-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .request-card {
            background: #FFFDF9;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.07);
        }

        .request-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }

        .customer-name {
            font-family: "Fraunces", serif;
            color: #8B1E3F;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .event-name {
            color: #666;
            font-size: 14px;
        }

        .status {
            padding: 7px 13px;
            border-radius: 20px;
            background: #D4A373;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail {
            background: #F5E9DA;
            padding: 13px;
            border-radius: 10px;
        }

        .detail-label {
            display: block;
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        .message-box {
            margin-top: 15px;
            padding: 13px;
            background: #faf5ef;
            border-radius: 10px;
            font-size: 14px;
            color: #555;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .action-button {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .accept-button {
            background: #8B1E3F;
            color: white;
        }

        .reject-button {
            background: #ddd;
            color: #1C1C1C;
        }

        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .completed-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #F5E9DA;
            color: #8B1E3F;
            font-weight: 600;
            text-align: center;
        }

        @media (max-width: 800px) {
            .requests-container {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 0 18px;
            }

            .brand {
                font-size: 26px;
            }

            .profile-name {
                display: none;
            }
        }

        @media (max-width: 550px) {
            .main {
                padding: 35px 18px;
            }

            h1 {
                font-size: 36px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .request-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <button
                class="back-button"
                onclick="goBack()">
                ←
            </button>

            <div class="brand">
                Annapriya
            </div>

        </div>

        <div class="header-right">

            <button
                class="notification-button"
                onclick="showNotifications()">

                🔔

                <span
                    class="notification-dot"
                    id="notificationDot">
                </span>

            </button>

            <button
                class="profile-button"
                onclick="toggleMenu()">

                <span
                    class="avatar"
                    id="avatar">
                    C
                </span>

                <span
                    class="profile-name"
                    id="catererName">
                    Caterer
                </span>

            </button>

            <button
                class="menu-button"
                onclick="toggleMenu()">

                ☰

            </button>

        </div>

    </header>


    <!-- PROFILE MENU -->

    <div
        class="dropdown"
        id="profileMenu">

        <a href="catererprofile.html">
            My Profile
        </a>

        <a href="catererprofile.html">
            Edit Profile
        </a>

        <a href="catererreviews.html">
            My Reviews
        </a>

        <a href="catereraccountsettings.html">
            Account Settings
        </a>

        <a href="catererevents.html">
            My Events
        </a>

        <a href="catererrequests.html">
            Event Requests
        </a>

        <a
            href="#"
            class="logout"
            onclick="logout(); return false;">

            Logout

        </a>

    </div>


    <!-- MAIN -->

    <main class="main">

        <div class="small-heading">
            CATERER
        </div>

        <h1>
            Event Requests
        </h1>

        <p class="subtitle">
            Review incoming customer requests for your catering services.
        </p>


        <div
            class="message"
            id="loadingMessage">

            Loading event requests...

        </div>


        <div
            class="message error-message"
            id="errorMessage">

            Unable to load event requests.

        </div>


        <div
            class="message"
            id="emptyMessage">

            No event requests yet.

        </div>


        <div
            class="requests-container"
            id="requestsContainer">

        </div>

    </main>


    <script>

        /* =====================================================
           BACKEND URL
        ===================================================== */

        const API_BASE_URL = "http://localhost:5000";


        /* =====================================================
           GET CATERER DATA
        ===================================================== */

        let catererData = null;

        try {

            catererData = JSON.parse(
                localStorage.getItem("annapriya_caterer") || "null"
            );

        } catch (error) {

            console.error(
                "Could not read caterer data:",
                error
            );

        }


        const token =
            localStorage.getItem(
                "annapriya_caterer_token"
            );


        /* =====================================================
           CATERER EMAIL
        ===================================================== */

        const catererEmail =
            catererData?.email ||
            catererData?.catererEmail ||
            catererData?.businessEmail ||
            "";


        /* =====================================================
           CATERER NAME
        ===================================================== */

        const displayName =
            catererData?.headName ||
            catererData?.name ||
            catererData?.brandName ||
            "Caterer";


        document.getElementById(
            "catererName"
        ).textContent = displayName;


        document.getElementById(
            "avatar"
        ).textContent =
            displayName.charAt(0).toUpperCase();


        /* =====================================================
           SAFE JSON RESPONSE
           Prevents:
           Unexpected end of JSON input
        ===================================================== */

        async function readResponse(response) {

            const text = await response.text();

            if (!text || !text.trim()) {

                return {};

            }

            try {

                return JSON.parse(text);

            } catch (error) {

                console.error(
                    "Invalid JSON response:",
                    text
                );

                return {};

            }

        }


        /* =====================================================
           LOAD EVENT REQUESTS
        ===================================================== */

        async function loadRequests() {

            const loading =
                document.getElementById(
                    "loadingMessage"
                );

            const error =
                document.getElementById(
                    "errorMessage"
                );

            const empty =
                document.getElementById(
                    "emptyMessage"
                );

            const container =
                document.getElementById(
                    "requestsContainer"
                );


            loading.style.display = "block";
            error.style.display = "none";
            empty.style.display = "none";
            container.innerHTML = "";


            try {

                if (!catererEmail) {

                    throw new Error(
                        "Caterer email not found. Please login again."
                    );

                }


                /*
                    IMPORTANT:
                    Backend is on PORT 5000.
                    Live Server is on PORT 5500.
                */

                const response = await fetch(

                    API_BASE_URL +
                    "/api/requests/caterer?email=" +
                    encodeURIComponent(
                        catererEmail
                    )

                );


                const data =
                    await readResponse(response);


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        `Server returned ${response.status}`
                    );

                }


                loading.style.display = "none";


                const requests =
                    Array.isArray(data.requests)
                        ? data.requests
                        : [];


                if (requests.length === 0) {

                    empty.style.display = "block";

                    return;

                }


                requests.forEach(
                    request => {

                        container.appendChild(
                            createRequestCard(request)
                        );

                    }
                );


                /* NOTIFICATION DOT */

                const pendingRequests =
                    requests.filter(
                        request =>
                            String(
                                request.status
                            ).toLowerCase() ===
                            "pending"
                    );


                if (pendingRequests.length > 0) {

                    document.getElementById(
                        "notificationDot"
                    ).style.display = "block";

                } else {

                    document.getElementById(
                        "notificationDot"
                    ).style.display = "none";

                }


            } catch (error) {

                console.error(
                    "Load requests error:",
                    error
                );


                loading.style.display = "none";

                errorMessage.textContent =
                    "Unable to load event requests. " +
                    error.message;

                errorMessage.style.display = "block";

            }

        }


        /* =====================================================
           CREATE REQUEST CARD
        ===================================================== */

        function createRequestCard(request) {

            const card =
                document.createElement("div");

            card.className =
                "request-card";


            const status =
                String(
                    request.status || "pending"
                ).toLowerCase();


            let actionHTML = "";


            if (status === "pending") {

                actionHTML = `

                    <div class="actions">

                        <button
                            class="action-button accept-button"
                            onclick="
                                updateRequest(
                                    ${Number(request.request_id)},
                                    'accepted',
                                    this
                                )
                            ">

                            Accept

                        </button>


                        <button
                            class="action-button reject-button"
                            onclick="
                                updateRequest(
                                    ${Number(request.request_id)},
                                    'rejected',
                                    this
                                )
                            ">

                            Reject

                        </button>

                    </div>

                `;

            } else {

                actionHTML = `

                    <div class="completed-message">

                        Request status:
                        ${escapeHtml(status)}

                    </div>

                `;

            }


            card.innerHTML = `

                <div class="request-top">

                    <div>

                        <div class="customer-name">

                            ${escapeHtml(
                                request.customer_name ||
                                "Customer"
                            )}

                        </div>

                        <div class="event-name">

                            ${escapeHtml(
                                request.event_type ||
                                "Event"
                            )}

                        </div>

                    </div>


                    <div class="status">

                        ${escapeHtml(status)}

                    </div>

                </div>


                <div class="details">


                    <div class="detail">

                        <span class="detail-label">
                            Event Date
                        </span>

                        <span class="detail-value">

                            ${formatDate(
                                request.event_date
                            )}

                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Event Time
                        </span>

                        <span class="detail-value">

                            ${escapeHtml(
                                request.event_time ||
                                "N/A"
                            )}

                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Guests
                        </span>

                        <span class="detail-value">

                            ${escapeHtml(
                                request.guest_count ||
                                "N/A"
                            )}

                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Location
                        </span>

                        <span class="detail-value">

                            ${escapeHtml(
                                request.venue_location ||
                                "N/A"
                            )}

                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Package
                        </span>

                        <span class="detail-value">

                            ${escapeHtml(
                                request.package_name ||
                                "N/A"
                            )}

                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Food Type
                        </span>

                        <span class="detail-value">

                            ${escapeHtml(
                                request.food_type ||
                                "N/A"
                            )}

                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Budget
                        </span>

                        <span class="detail-value">

                            ${
                                request.budget != null
                                    ? "₹" +
                                      escapeHtml(
                                          Number(
                                              request.budget
                                          ).toFixed(2)
                                      )
                                    : "N/A"
                            }

                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Service
                        </span>

                        <span class="detail-value">

                            ${escapeHtml(
                                request.catering_service ||
                                "N/A"
                            )}

                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Phone
                        </span>

                        <span class="detail-value">

                            ${escapeHtml(
                                request.phone ||
                                "N/A"
                            )}

                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Email
                        </span>

                        <span class="detail-value">

                            ${escapeHtml(
                                request.email ||
                                "N/A"
                            )}

                        </span>

                    </div>


                </div>


                ${
                    request.special_requirements
                        ? `

                            <div class="message-box">

                                <strong>
                                    Special Requirements:
                                </strong>

                                ${escapeHtml(
                                    request.special_requirements
                                )}

                            </div>

                        `
                        : ""
                }


                ${
                    request.message
                        ? `

                            <div class="message-box">

                                <strong>
                                    Message:
                                </strong>

                                ${escapeHtml(
                                    request.message
                                )}

                            </div>

                        `
                        : ""
                }


                ${actionHTML}

            `;


            return card;

        }


        /* =====================================================
           ACCEPT / REJECT REQUEST
        ===================================================== */

        async function updateRequest(
            requestId,
            newStatus,
            button
        ) {

            const card =
                button.closest(
                    ".request-card"
                );


            const buttons =
                card.querySelectorAll(
                    ".action-button"
                );


            buttons.forEach(
                item => {

                    item.disabled = true;

                }
            );


            try {

                /*
                    IMPORTANT:
                    PUT also goes to PORT 5000.
                */

                const response = await fetch(

                    API_BASE_URL +
                    "/api/requests/" +
                    encodeURIComponent(
                        requestId
                    ) +
                    "/status",

                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            status:
                                newStatus,

                            catererId:
                                catererData?.id ||
                                catererData?.catererId ||
                                catererEmail,

                            catererEmail:
                                catererEmail

                        })

                    }

                );


                /*
                    DO NOT directly use:
                    response.json()

                    because an empty response
                    causes:

                    Unexpected end of JSON input
                */

                const data =
                    await readResponse(response);


                if (!response.ok) {

                    throw new Error(

                        data.message ||
                        data.error ||
                        `Server returned ${response.status}`

                    );

                }


                if (newStatus === "accepted") {

                    alert(
                        data.message ||
                        "Request accepted. Payment is now pending."
                    );

                } else {

                    alert(
                        data.message ||
                        "Request rejected."
                    );

                }


                await loadRequests();


            } catch (error) {

                console.error(
                    "Update request error:",
                    error
                );


                alert(
                    error.message ||
                    "Could not update request."
                );


                buttons.forEach(
                    item => {

                        item.disabled = false;

                    }
                );

            }

        }


        /* =====================================================
           DATE FORMAT
        ===================================================== */

        function formatDate(dateValue) {

            if (!dateValue) {

                return "N/A";

            }


            try {

                const date =
                    new Date(
                        dateValue
                    );


                if (Number.isNaN(
                    date.getTime()
                )) {

                    return String(
                        dateValue
                    );

                }


                return date.toLocaleDateString(
                    "en-IN",
                    {
                        day: "2-digit",
                        month: "short",
                        year: "numeric"
                    }
                );

            } catch (error) {

                return String(
                    dateValue
                );

            }

        }


        /* =====================================================
           HTML ESCAPE
        ===================================================== */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           PROFILE MENU
        ===================================================== */

        function toggleMenu() {

            document
                .getElementById(
                    "profileMenu"
                )
                .classList.toggle(
                    "show"
                );

        }


        document.addEventListener(
            "click",
            function(event) {

                const menu =
                    document.getElementById(
                        "profileMenu"
                    );

                const menuButtons =
                    document.querySelectorAll(
                        ".menu-button, .profile-button"
                    );


                let clickedButton = false;


                menuButtons.forEach(
                    button => {

                        if (
                            button.contains(
                                event.target
                            )
                        ) {

                            clickedButton = true;

                        }

                    }
                );


                if (
                    !menu.contains(
                        event.target
                    ) &&
                    !clickedButton
                ) {

                    menu.classList.remove(
                        "show"
                    );

                }

            }
        );


        /* =====================================================
           NOTIFICATIONS
        ===================================================== */

        function showNotifications() {

            const dot =
                document.getElementById(
                    "notificationDot"
                );


            if (
                dot.style.display ===
                "block"
            ) {

                alert(
                    "You have new customer event requests."
                );

            } else {

                alert(
                    "No new notifications."
                );

            }

        }


        /* =====================================================
           BACK
        ===================================================== */

        function goBack() {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            } else {

                window.location.href =
                    "catererdashboard.html";

            }

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        function logout() {

            localStorage.removeItem(
                "annapriya_caterer"
            );

            localStorage.removeItem(
                "annapriya_caterer_token"
            );

            localStorage.removeItem(
                "caterer"
            );

            localStorage.removeItem(
                "catererToken"
            );


            window.location.href =
                "index.html";

        }


        /* =====================================================
           START
        ===================================================== */

        if (!catererEmail) {

            console.warn(
                "Caterer email is missing from localStorage."
            );

        }


        loadRequests();

    </script>

</body>

</html>
