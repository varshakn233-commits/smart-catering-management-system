<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Requests | Annapriya</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --maroon: #8B1E3F;
            --maroon-dark: #701631;
            --beige: #F5E9DA;
            --black: #1C1C1C;
            --gold: #D4A373;
            --white: #FFFFFF;
            --border: #ead9c8;
            --text-light: #6f6258;
            --success: #2e8b57;
            --warning: #d89b24;
            --danger: #c0392b;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family: "Work Sans", sans-serif;
            background: var(--beige);
            color: var(--black);
            overflow-x: hidden;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            width: 100%;
            height: 90px;

            background: #FFFDF9;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            border-bottom: 1px solid #eadfd3;
        }


        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }


        .back-button {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 50%;

            background: var(--beige);
            color: var(--maroon);

            font-size: 25px;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .back-button:hover {
            background: #ead9c8;
        }


        .brand {
            font-family: "Fraunces", serif;

            font-size: 32px;
            font-weight: 700;

            color: var(--maroon);
        }


        .refresh-button {
            border: none;

            background: var(--maroon);
            color: var(--white);

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-family: "Work Sans", sans-serif;
            font-weight: 600;

            transition: 0.2s ease;

            white-space: nowrap;
        }


        .refresh-button:hover {
            background: var(--maroon-dark);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            width: 100%;
            max-width: none;

            margin: 0;

            padding: 55px 5% 70px;
        }


        .small-heading {
            color: var(--gold);

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 2px;

            margin-bottom: 10px;
        }


        h1 {
            font-family: "Fraunces", serif;

            font-size: 46px;

            color: var(--maroon);

            margin-bottom: 12px;
        }


        .subtitle {
            color: var(--text-light);

            font-size: 16px;

            margin-bottom: 35px;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {
            width: 100%;

            background: var(--white);

            padding: 22px;

            border-radius: 12px;

            text-align: center;

            color: var(--text-light);

            margin-bottom: 20px;
        }


        #loadingMessage,
        #errorMessage,
        #emptyMessage {
            display: none;
        }


        #errorMessage {
            color: var(--maroon);
        }


        #errorText {
            color: var(--text-light);
        }


        /* =====================================================
           REQUEST SECTION
        ===================================================== */

        #requestsSection {
            width: 100%;
        }


        .section-header {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: flex-start;

            margin: 30px 0 20px;
        }


        .section-title {
            font-family: "Fraunces", serif;

            color: var(--maroon);

            font-size: 30px;
        }


        #requestCount {
            display: none !important;
        }


        /* =====================================================
           REQUEST LIST
        ===================================================== */

        .requests-list {
            width: 100%;
            display: block;
        }


        /* =====================================================
           TABLE WRAPPER
        ===================================================== */

        .table-scroll {
            width: 100%;

            background: var(--white);

            border-radius: 16px;

            box-shadow:
                0 5px 18px rgba(77, 45, 25, 0.08);

            overflow: hidden;
        }


        /* =====================================================
           TABLE
        ===================================================== */

        .requests-table {
            width: 100%;

            border-collapse: collapse;

            table-layout: fixed;
        }


        .requests-table thead {
            background: var(--white);
        }


        .requests-table th {
            padding: 18px 10px;

            text-align: left;

            color: var(--black);

            font-size: 13px;
            font-weight: 600;

            border-bottom: 1px solid var(--border);

            white-space: nowrap;

            vertical-align: middle;
        }


        .requests-table td {
            padding: 20px 10px;

            color: #333;

            font-size: 13px;

            border-bottom: 1px solid #eee3d8;

            vertical-align: middle;

            overflow: hidden;

            overflow-wrap: normal;

            word-break: normal;
        }


        .requests-table tbody tr:last-child td {
            border-bottom: none;
        }


        .requests-table tbody tr:hover {
            background: #fffaf5;
        }


        /* =====================================================
           COLUMN WIDTHS
           TOTAL = 100%
        ===================================================== */

        .requests-table th:nth-child(1),
        .requests-table td:nth-child(1) {
            width: 12%;
        }


        .requests-table th:nth-child(2),
        .requests-table td:nth-child(2) {
            width: 13%;
        }


        .requests-table th:nth-child(3),
        .requests-table td:nth-child(3) {
            width: 11%;
        }


        .requests-table th:nth-child(4),
        .requests-table td:nth-child(4) {
            width: 15%;
        }


        .requests-table th:nth-child(5),
        .requests-table td:nth-child(5) {
            width: 7%;

            text-align: center;
        }


        .requests-table th:nth-child(6),
        .requests-table td:nth-child(6) {
            width: 15%;
        }


        .requests-table th:nth-child(7),
        .requests-table td:nth-child(7) {
            width: 15%;
        }


        .requests-table th:nth-child(8),
        .requests-table td:nth-child(8) {
            width: 12%;
        }


        /* =====================================================
           REQUEST CONTENT
        ===================================================== */

        .requests-table strong {
            display: block;

            color: var(--black);

            font-weight: 600;

            line-height: 1.4;
        }


        .requests-table small {
            display: block;

            margin-top: 5px;

            color: var(--text-light);

            font-size: 11px;

            line-height: 1.4;
        }


        .linked-enquiry {
            color: var(--maroon) !important;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 7px 10px;

            border-radius: 20px;

            font-size: 10px;

            font-weight: 600;

            white-space: nowrap;

            line-height: 1.3;

            text-transform: capitalize;

            max-width: 100%;
        }


        .status-pending {
            background: #F0D9A8;
            color: var(--black);
        }


        .status-accepted {
            background: #D8E8D0;
            color: var(--black);
        }


        .status-payment {
            background: #F0D9A8;
            color: var(--black);
        }


        .status-confirmed {
            background: #D8E8D0;
            color: var(--black);
        }


        .status-preparing {
            background: #D8E8D0;
            color: var(--black);
        }


        .status-on-the-way {
            background: #D8E8D0;
            color: var(--black);
        }


        .status-event-started {
            background: #D8E8D0;
            color: var(--black);
        }


        .status-rejected {
            background: #E7C5C5;
            color: var(--black);
        }


        .status-completed {
            background: #CDE4D2;
            color: var(--black);
        }


        .status-enquiry {
            background: var(--gold);
            color: var(--black);
        }


        /* =====================================================
           PROGRESS
        ===================================================== */

        .progress-wrap {
            width: 100%;
        }


        .progress-dots {
            width: 100%;

            display: flex;

            align-items: center;
        }


        .progress-step {
            display: flex;

            align-items: center;

            flex: 1;

            min-width: 0;
        }


        .progress-step:last-child {
            flex: 0 0 auto;
        }


        .progress-dot {
            width: 11px;
            height: 11px;

            min-width: 11px;

            border-radius: 50%;

            background: #ddd;

            border: 2px solid #ddd;

            display: block;

            position: relative;

            z-index: 2;
        }


        .progress-dot.completed {
            background: var(--gold);

            border-color: var(--gold);
        }


        .progress-dot.active {
            width: 14px;
            height: 14px;

            min-width: 14px;

            background: var(--maroon);

            border-color: var(--maroon);

            box-shadow:
                0 0 0 3px rgba(139, 30, 63, 0.15);
        }


        .progress-line {
            flex: 1;

            min-width: 4px;

            height: 3px;

            background: #ddd;
        }


        .progress-line.completed {
            background: var(--gold);
        }


        /* =====================================================
           WAITING
        ===================================================== */

        .waiting-text {
            display: inline-block;

            color: #777;

            font-size: 11px;

            line-height: 1.4;

            white-space: nowrap;
        }


        .no-action {
            color: #999;

            font-size: 13px;

            white-space: nowrap;
        }


        /* =====================================================
           ACTION
        ===================================================== */

        .table-action {
            display: inline-block;

            border: none;

            border-radius: 7px;

            padding: 8px 10px;

            cursor: pointer;

            font-family: "Work Sans", sans-serif;

            font-size: 10px;

            font-weight: 600;

            white-space: nowrap;

            transition: 0.2s ease;
        }


        .table-action:hover {
            opacity: 0.88;
        }


        .book-action {
            background: var(--maroon);
            color: var(--white);
        }


        .pay-action {
            background: var(--maroon);
            color: var(--white);
        }


        .track-action {
            background: var(--gold);
            color: var(--black);
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1100px) {

            .main {
                padding-left: 3%;
                padding-right: 3%;
            }


            .requests-table th,
            .requests-table td {
                padding-left: 7px;
                padding-right: 7px;
            }


            .requests-table th {
                font-size: 11px;
            }


            .requests-table td {
                font-size: 11px;
            }


            .status {
                font-size: 9px;
                padding: 6px 8px;
            }


            .waiting-text {
                font-size: 10px;
            }


            .progress-dot {
                width: 9px;
                height: 9px;
                min-width: 9px;
            }


            .progress-dot.active {
                width: 12px;
                height: 12px;
                min-width: 12px;
            }

        }


        @media (max-width: 700px) {

            .header {
                height: 75px;

                padding: 0 18px;
            }


            .brand {
                font-size: 26px;
            }


            .back-button {
                width: 40px;
                height: 40px;

                font-size: 22px;
            }


            .refresh-button {
                padding: 9px 13px;

                font-size: 12px;
            }


            .main {
                padding: 35px 12px 50px;
            }


            h1 {
                font-size: 36px;
            }


            .section-title {
                font-size: 26px;
            }


            .table-scroll {
                border-radius: 12px;
            }


            .requests-table th {
                padding: 14px 6px;

                font-size: 10px;
            }


            .requests-table td {
                padding: 16px 6px;

                font-size: 10px;
            }


            .status {
                font-size: 8px;

                padding: 5px 6px;
            }


            .waiting-text {
                font-size: 9px;
            }


            .table-action {
                padding: 7px 8px;

                font-size: 9px;
            }


            .progress-dot {
                width: 8px;
                height: 8px;

                min-width: 8px;
            }


            .progress-dot.active {
                width: 11px;
                height: 11px;

                min-width: 11px;
            }


            .progress-line {
                height: 2px;

                min-width: 2px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="header">

        <div class="header-left">

            <button
                type="button"
                class="back-button"
                onclick="goBack()"
            >
                ←
            </button>


            <div class="brand">
                Annapriya
            </div>

        </div>


        <button
            type="button"
            class="refresh-button"
            onclick="window.location.reload()"
        >
            ↻ Refresh
        </button>

    </header>


    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main class="main">

        <div class="small-heading">
            CUSTOMER
        </div>


        <h1>
            My Requests
        </h1>


        <p class="subtitle">
            Track your enquiries, bookings, payments, and event progress.
        </p>


        <!-- =================================================
             LOADING
        ================================================= -->

        <div
            class="message"
            id="loadingMessage"
        >
            Loading your requests...
        </div>


        <!-- =================================================
             ERROR
        ================================================= -->

        <div
            class="message"
            id="errorMessage"
        >

            Unable to load your requests.


            <div
                id="errorText"
                style="margin-top: 8px;"
            ></div>


            <button
                type="button"
                class="table-action book-action"
                style="margin-top: 15px;"
                onclick="window.location.reload()"
            >
                Try Again
            </button>

        </div>


        <!-- =================================================
             EMPTY
        ================================================= -->

        <div
            class="message"
            id="emptyMessage"
        >
            You don't have any enquiries or event requests yet.
        </div>


        <!-- =================================================
             REQUEST SECTION
        ================================================= -->

        <div id="requestsSection">

            <div class="section-header">

                <div class="section-title">
                    Your Requests
                </div>


                <span
                    id="requestCount"
                    aria-hidden="true"
                >
                    0
                </span>

            </div>


            <div
                class="requests-list"
                id="requestsList"
            ></div>

        </div>

    </main>


    <!-- =====================================================
         EXISTING JAVASCRIPT
    ===================================================== -->

    <script src="myrequests.js"></script>


    <script>

        function goBack() {

            if (window.history.length > 1) {

                window.history.back();

            } else {

                window.location.href =
                    "customerdashboard.html";

            }

        }

    </script>


</body>

</html>
